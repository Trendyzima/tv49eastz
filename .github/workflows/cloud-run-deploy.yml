name: Deploy Cloud Run Gateway + Cloudflare Relay

on:
  push:
    branches: [master]
    paths:
      - 'stream-gateway/**'
      - 'cloudflare-relay/**'
      - '.github/workflows/cloud-run-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tv49eastz-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
  GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GATEWAY_API_KEY: ${{ secrets.TV49_GATEWAY_API_KEY }}
          GATEWAY_CAPABILITY_KEY: ${{ secrets.TV49_GATEWAY_CAPABILITY_KEY }}
          RELAY_SIGNING_SECRET: ${{ secrets.TV49_RELAY_SIGNING_SECRET }}
          RELAY_DEVICE_SECRET: ${{ secrets.TV49_RELAY_DEVICE_SECRET }}
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_ARTIFACT_REPOSITORY GCP_CLOUD_RUN_SERVICE GCP_WIF_PROVIDER GCP_DEPLOYER_SERVICE_ACCOUNT GCP_RUNTIME_SERVICE_ACCOUNT CF_ACCOUNT CF_TOKEN GATEWAY_API_KEY GATEWAY_CAPABILITY_KEY RELAY_SIGNING_SECRET RELAY_DEVICE_SECRET; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub variable/secret: $name"; exit 1; }
          done

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 550.0.0'

      - name: Verify Google APIs and Artifact Registry
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com secretmanager.googleapis.com --quiet
          gcloud artifacts repositories describe "$GCP_ARTIFACT_REPOSITORY" --location="$GCP_REGION" >/dev/null

      - name: Synchronize production secrets to Secret Manager
        env:
          GATEWAY_API_KEY: ${{ secrets.TV49_GATEWAY_API_KEY }}
          GATEWAY_CAPABILITY_KEY: ${{ secrets.TV49_GATEWAY_CAPABILITY_KEY }}
          RELAY_DEVICE_SECRET: ${{ secrets.TV49_RELAY_DEVICE_SECRET }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1" value="$2"
            if gcloud secrets describe "$name" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              printf '%s' "$value" | gcloud secrets versions add "$name" --data-file=- --project="$GCP_PROJECT_ID" >/dev/null
            else
              printf '%s' "$value" | gcloud secrets create "$name" --data-file=- --replication-policy=automatic --project="$GCP_PROJECT_ID" >/dev/null
            fi
          }
          put_secret tv49-gateway-api-key "$GATEWAY_API_KEY"
          put_secret tv49-gateway-capability-key "$GATEWAY_CAPABILITY_KEY"
          put_secret tv49-relay-device-secret "$RELAY_DEVICE_SECRET"

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push production gateway image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/tv49eastz-stream-gateway:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --pull --tag "$IMAGE" ./stream-gateway
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Bootstrap Cloudflare relay and capture its URL
        id: relay-bootstrap
        uses: cloudflare/wrangler-action@v4
        env:
          RELAY_SIGNING_SECRET: ${{ secrets.TV49_RELAY_SIGNING_SECRET }}
          RELAY_DEVICE_SECRET: ${{ secrets.TV49_RELAY_DEVICE_SECRET }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-relay
          command: deploy
          secrets: |
            RELAY_SIGNING_SECRET
            RELAY_DEVICE_SECRET

      - name: Validate relay URL
        env:
          CF_URL: ${{ steps.relay-bootstrap.outputs.deployment-url }}
        run: |
          set -euo pipefail
          [[ "$CF_URL" == https://*.workers.dev ]] || { echo "Wrangler did not return a workers.dev URL: $CF_URL"; exit 1; }
          echo "CF_URL=$CF_URL" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run gateway
        id: cloud-run
        env:
          CF_URL: ${{ steps.relay-bootstrap.outputs.deployment-url }}
        run: |
          set -euo pipefail
          gcloud run deploy "$GCP_CLOUD_RUN_SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --port 8080 \
            --timeout 60m \
            --session-affinity \
            --concurrency 20 \
            --min 0 \
            --max 1 \
            --set-env-vars "TUNNEL_PROXY_BASE_URL=$CF_URL,GATEWAY_LISTEN=:8787" \
            --update-secrets "GATEWAY_API_KEY=tv49-gateway-api-key:latest,GATEWAY_CAPABILITY_KEY=tv49-gateway-capability-key:latest,TUNNEL_PROXY_AUTH=tv49-relay-device-secret:latest"

          GATEWAY_URL="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" --region "$GCP_REGION" --format='value(status.url)')"
          [[ "$GATEWAY_URL" == https://*.run.app ]] || { echo "Invalid Cloud Run URL: $GATEWAY_URL"; exit 1; }
          echo "GATEWAY_URL=$GATEWAY_URL" >> "$GITHUB_ENV"
          echo "PUBLIC_GATEWAY_URL=$GATEWAY_URL" >> "$GITHUB_OUTPUT"
          echo "Cloud Run gateway: $GATEWAY_URL"

      - name: Wire Worker to actual Cloud Run URL
        uses: cloudflare/wrangler-action@v4
        env:
          GATEWAY_ORIGIN: ${{ steps.cloud-run.outputs.PUBLIC_GATEWAY_URL }}
          RELAY_SIGNING_SECRET: ${{ secrets.TV49_RELAY_SIGNING_SECRET }}
          RELAY_DEVICE_SECRET: ${{ secrets.TV49_RELAY_DEVICE_SECRET }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-relay
          command: deploy
          vars: |
            GATEWAY_ORIGIN
          secrets: |
            RELAY_SIGNING_SECRET
            RELAY_DEVICE_SECRET

      - name: Production Cloud Run health check
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl --silent --show-error --max-time 15 --write-out '\n%{http_code}' "$GATEWAY_URL/health" || true)"
            code="${body##*$'\n'}"
            payload="${body%$'\n'*}"
            echo "Attempt $attempt/30: HTTP $code $payload"
            if [[ "$code" == 200 ]] && grep -q '"ok"' <<<"$payload"; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Verify /v1/session and HLS routing at Cloud Run
        run: |
          set -euo pipefail
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 -X POST "$GATEWAY_URL/v1/session")"
          [[ "$code" == 401 ]] || { echo "Expected 401 from /v1/session without credentials; got $code"; exit 1; }
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$GATEWAY_URL/stream/smoke/index.m3u8")"
          case "$code" in 400|401|403|503) ;; *) echo "Unexpected HLS status: $code"; exit 1 ;; esac

      - name: Verify Cloudflare Worker -> Cloud Run routing
        run: |
          set -euo pipefail
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$CF_URL/health")"
          [[ "$code" == 200 ]] || { echo "Cloudflare /health failed: $code"; exit 1; }
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 -X POST "$CF_URL/v1/session")"
          [[ "$code" == 401 ]] || { echo "Worker -> Cloud Run /v1/session failed: $code"; exit 1; }

      - name: Publish production deployment summary
        if: success()
        run: |
          {
            echo '## TV49 East production deployment';
            echo "- Gateway: $GATEWAY_URL";
            echo "- Cloudflare relay: $CF_URL";
            echo "- Image: $IMAGE";
            echo '- Runtime: Google Cloud Run';
            echo '- Cloudflare Containers: removed';
            echo '- Health: PASS';
            echo '- /v1/session routing: PASS';
            echo '- HLS routing: PASS';
          } >> "$GITHUB_STEP_SUMMARY"