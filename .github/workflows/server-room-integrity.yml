name: Server Room Integrity

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  protected-server:
    name: Protect existing FadCam server/application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load protected baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(tr -d '[:space:]' < server-room/BASELINE)"
          test -n "$baseline"
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"

      - name: Reject unauthorized changes inside protected FadCam boundary
        shell: bash
        env:
          BASELINE: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "$BASELINE^{commit}"; then
            echo "Protected baseline $BASELINE is unavailable in this checkout."
            exit 1
          fi

          echo "Protected baseline: $BASELINE"
          echo "Current revision:    $(git rev-parse HEAD)"

          changed="$(git diff --name-only --no-renames "$BASELINE" HEAD -- \
            'app/src/main/java/com/fadcam/**' \
            'app/src/main/res/**' \
            'app/src/main/AndroidManifest.xml')"

          exceptions_file="server-room/PROTECTED_EXCEPTIONS"
          approved_exceptions=""
          if [ -f "$exceptions_file" ]; then
            today="$(date -u +%F)"
            while IFS='|' read -r raw_path raw_approval raw_expiry raw_purpose; do
              path="$(printf '%s' "$raw_path" | xargs)"
              approval="$(printf '%s' "$raw_approval" | xargs)"
              expiry="$(printf '%s' "$raw_expiry" | xargs)"
              purpose="$(printf '%s' "$raw_purpose" | sed 's/^ *//')"
              [ -z "$path" ] && continue
              case "$path" in
                \#*) continue ;;
              esac
              if [ -z "$approval" ] || [ -z "$expiry" ] || [ -z "$purpose" ]; then
                echo "Malformed protected exception entry: $path"
                exit 1
              fi
              if ! [[ "$expiry" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                echo "Invalid exception expiry for $path: $expiry"
                exit 1
              fi
              if [[ "$expiry" < "$today" ]]; then
                echo "Expired protected exception: $path (expired $expiry)"
                exit 1
              fi
              approved_exceptions="${approved_exceptions}${path}\n"
              echo "Approved exception: $path | $approval | expires $expiry | $purpose"
            done < "$exceptions_file"
          fi

          unauthorized=""
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if printf '%b' "$approved_exceptions" | grep -Fxq "$path"; then
              continue
            fi
            unauthorized="${unauthorized}${path}\n"
          done <<< "$changed"

          if [ -n "$(printf '%b' "$unauthorized" | sed '/^[[:space:]]*$/d')" ]; then
            echo "Unauthorized protected FadCam changes detected:"
            printf '%b' "$unauthorized" | sed '/^[[:space:]]*$/d'
            exit 1
          fi

          echo "Protected boundary unchanged except explicitly approved, time-limited exceptions."

      - name: Verify bridge separation
        shell: bash
        run: |
          set -euo pipefail
          test -d server-tap
          test -d stream-gateway
          echo "Bridge separation verified."