name: Stream Gateway

on:
  push:
    paths:
      - 'stream-gateway/**'
      - '.github/workflows/stream-gateway.yml'
  pull_request:
    paths:
      - 'stream-gateway/**'
      - '.github/workflows/stream-gateway.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stream-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go vet ./...
