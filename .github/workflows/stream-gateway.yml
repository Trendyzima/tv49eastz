name: Stream Gateway

on:
  push:
    paths:
      - 'stream-gateway/**'
      - '.github/workflows/stream-gateway.yml'
  pull_request:
    paths:
      - 'stream-gateway/**'
      - '.github/workflows/stream-gateway.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stream-gateway
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t go_files < <(find . -type f -name '*.go' -print)
          if ((${#go_files[@]} == 0)); then
            echo 'No Go files found.'
            exit 1
          fi
          unformatted=0
          for file in "${go_files[@]}"; do
            if ! gofmt -d "$file" | grep -q .; then
              continue
            fi
            echo "Unformatted Go source: $file"
            gofmt -d "$file"
            unformatted=1
          done
          if ((unformatted)); then
            exit 1
          fi
      - name: Run gateway tests
        run: go test ./... -count=1 -race
      - name: Vet gateway
        run: go vet ./...
