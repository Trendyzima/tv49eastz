name: Secure Stream Integration

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stream-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: stream-gateway/go.mod
      - name: Run gateway security tests
        run: go test ./... -count=1 -race
      - name: Vet gateway
        run: go vet ./...
