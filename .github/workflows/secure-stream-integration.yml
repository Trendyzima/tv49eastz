name: Secure Stream Integration

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stream-gateway
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: stream-gateway/go.mod
      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l $(find . -name '*.go' -type f))"
          if [[ -n "${unformatted}" ]]; then
            echo 'Unformatted Go files:'
            printf '%s\n' "${unformatted}"
            exit 1
          fi
      - name: Run gateway security tests
        run: go test ./... -count=1 -race
      - name: Vet gateway
        run: go vet ./...
