name: Secure Stream Integration

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stream-gateway
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: stream-gateway/go.mod
      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t go_files < <(find . -type f -name '*.go' -print)
          if ((${#go_files[@]} == 0)); then
            echo 'No Go files found.'
            exit 1
          fi
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            echo 'Unformatted Go files:'
            printf '%s\n' "${unformatted}"
            echo 'Run gofmt -w on the listed files and commit the result.'
            exit 1
          fi
      - name: Run gateway security tests
        run: go test ./... -count=1 -race
      - name: Vet gateway
        run: go vet ./...
