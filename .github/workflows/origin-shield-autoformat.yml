name: Origin Shield Autoformat

on:
  push:
    branches:
      - feat/origin-shield-v1
    paths:
      - 'origin-shield/**/*.go'
      - '.github/workflows/origin-shield-autoformat.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Format Origin Shield Go
        run: gofmt -w origin-shield/*.go
      - name: Commit formatting fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add origin-shield/*.go
          git commit -m 'chore: gofmt origin shield'
          git push
