name: Forensic Certification

on:
  workflow_dispatch:
  push:
    branches: [master, forensic-overhaul-2026-08-31]

permissions:
  contents: read

concurrency:
  group: forensic-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-security:
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: device-tunnel
            go: '1.23.x'
          - module: stream-gateway
            go: '1.22.x'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: Go tests
        run: go test ./... -count=1
      - name: Go race tests
        run: go test ./... -count=1 -race
      - name: Go vet
        run: go vet ./...
      - name: Go build
        run: go build ./...
        env:
          CGO_ENABLED: '0'

  android-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        run: test -x ./gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android unit tests
        run: ./gradlew testDefaultDebugUnitTest --no-daemon --stacktrace
      - name: Android debug build
        run: ./gradlew assembleDefaultDebug --no-daemon --stacktrace

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required source boundaries
        run: |
          test -d app
          test -d server-tap
          test -d device-tunnel
          test -d stream-gateway
          test -d internal/deviceauth
          test -x ./gradlew
      - name: Verify FadCam server remains isolated
        run: |
          test -f docs/FORENSIC_AUDIT_2026-08-31.md
          grep -q 'FadCam' docs/FORENSIC_AUDIT_2026-08-31.md
