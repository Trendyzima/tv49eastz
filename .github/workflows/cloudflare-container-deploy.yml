name: Deploy Cloudflare Worker + Go Container

on:
  push:
    branches: [master]
    paths:
      - 'stream-gateway/**'
      - 'cloudflare-relay/**'
      - '.github/workflows/cloudflare-container-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$CF_ACCOUNT" ]] || { echo 'Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          [[ -n "$CF_TOKEN" ]] || { echo 'Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN'; exit 1; }
          echo 'Cloudflare credentials are present.'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-relay/package.json

      - name: Install Worker dependencies
        working-directory: cloudflare-relay
        run: npm install --no-audit --no-fund

      - name: Generate Worker types
        working-directory: cloudflare-relay
        run: npm run types

      - name: Typecheck Worker
        working-directory: cloudflare-relay
        run: npx tsc --noEmit

      - name: Normalize and commit Go formatting
        shell: bash
        run: |
          set -euo pipefail
          echo 'Normalizing Go source with gofmt before validation...'
          gofmt -w stream-gateway
          if git diff --quiet -- stream-gateway; then
            echo 'Go source was already gofmt-clean.'
          else
            echo 'gofmt changed Go source; committing the canonical formatting.'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add stream-gateway
            git commit -m 'style: gofmt stream gateway'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          files="$(gofmt -l stream-gateway)"
          test -z "$files" || { echo 'gofmt verification failed:'; printf '%s\n' "$files"; exit 1; }
          echo 'All Go files are gofmt-clean.'

      - name: Test Go gateway
        working-directory: stream-gateway
        run: go test ./... -count=1 -race

      - name: Vet Go gateway
        working-directory: stream-gateway
        run: go vet ./...

      - name: Build Linux amd64 Go binary
        working-directory: stream-gateway
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/stream-gateway ./
          file /tmp/stream-gateway

      - name: Build and push Cloudflare Container image
        id: image
        working-directory: cloudflare-relay
        shell: bash
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          IMAGE_TAG="tv49eastz-stream-gateway:${GITHUB_SHA}"
          echo "Building and pushing ${IMAGE_TAG}"
          npx --yes wrangler@latest containers build -p -t "$IMAGE_TAG" ../stream-gateway
          IMAGE_REF="registry.cloudflare.com/${CF_ACCOUNT}/tv49eastz-stream-gateway:${GITHUB_SHA}"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "Published image: $IMAGE_REF"

      - name: Pin deployed Worker to published image
        working-directory: cloudflare-relay
        env:
          IMAGE_REF: ${{ steps.image.outputs.IMAGE_REF }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          const image = process.env.IMAGE_REF;
          if (!image) throw new Error('IMAGE_REF is empty');
          const text = fs.readFileSync(path, 'utf8');
          const updated = text.replace(/("image"\s*:\s*)"[^"]+"/, `$1"${image}"`);
          if (updated === text) throw new Error('Container image entry not found');
          fs.writeFileSync(path, updated);
          NODE
          grep -n '"image"' wrangler.jsonc

      - name: Deploy Worker with published Container
        id: initial_deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-relay
          command: deploy --containers-rollout=immediate

      - name: Bootstrap persistent Worker secrets
        working-directory: cloudflare-relay
        env:
          PUBLIC_URL: ${{ steps.initial_deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PUBLIC_URL" ]] || { echo 'Wrangler did not return a deployment URL.'; exit 1; }
          PUBLIC_URL="${PUBLIC_URL%/}"
          echo "Discovered Cloudflare Worker URL: $PUBLIC_URL"
          secrets_json="$(npx --yes wrangler@latest secret list)"
          ensure_secret() {
            local name="$1" value="$2"
            if printf '%s' "$secrets_json" | grep -q '"name"[[:space:]]*:[[:space:]]*"'"$name"'"'; then
              echo "$name already exists; preserving it."
              return 0
            fi
            echo "Creating missing Worker secret: $name"
            printf '%s' "$value" | npx --yes wrangler@latest secret put "$name"
            secrets_json="$(npx --yes wrangler@latest secret list)"
          }
          ensure_secret GATEWAY_API_KEY "$(openssl rand -hex 64)"
          ensure_secret GATEWAY_CAPABILITY_KEY "$(openssl rand -hex 64)"
          ensure_secret RELAY_SIGNING_SECRET "$(openssl rand -hex 64)"
          ensure_secret RELAY_DEVICE_SECRET "$(openssl rand -hex 64)"
          ensure_secret TUNNEL_PROXY_BASE_URL "$PUBLIC_URL"

      - name: Redeploy Worker with persistent runtime secrets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-relay
          command: deploy --containers-rollout=immediate

      - name: Verify production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          echo "PUBLIC_GATEWAY_URL=$DEPLOYMENT_URL"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 15 "$DEPLOYMENT_URL/health"; then
              echo
              echo 'Worker + Container health check passed.'
              exit 0
            fi
            echo "Health check attempt $attempt/20 failed; waiting 15s for Container provisioning..."
            sleep 15
          done
          echo 'Container health check did not become ready within the verification window.'
          exit 1

      - name: Inspect deployed Container applications
        working-directory: cloudflare-relay
        run: |
          set -euo pipefail
          npx --yes wrangler@latest containers list
          npx --yes wrangler@latest containers images list
