name: Deploy Cloudflare Worker + Go Container

on:
  push:
    branches: [master]
    paths:
      - 'stream-gateway/**'
      - 'cloudflare-relay/**'
      - '.github/workflows/cloudflare-container-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$CF_ACCOUNT" ]] || { echo 'Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          [[ -n "$CF_TOKEN" ]] || { echo 'Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN'; exit 1; }
          echo 'Cloudflare credentials are present.'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-relay/package.json

      - name: Install Worker dependencies
        working-directory: cloudflare-relay
        run: npm install --no-audit --no-fund

      - name: Generate Worker types
        working-directory: cloudflare-relay
        run: npm run types

      - name: Typecheck Worker
        working-directory: cloudflare-relay
        run: npx tsc --noEmit

      - name: Test Go gateway
        working-directory: stream-gateway
        run: |
          go test ./... -count=1 -race
          go vet ./...
          test -z "$(gofmt -l .)"

      - name: Build and push immutable Go Container image
        working-directory: stream-gateway
        run: |
          npx --yes wrangler@latest containers build -p -t "stream-gateway:${GITHUB_SHA}" .

      - name: Create CI Wrangler config with immutable image tag
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          src = json.loads(Path('cloudflare-relay/wrangler.jsonc').read_text())
          src['containers'][0]['image'] = f"registry.cloudflare.com/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/stream-gateway:{os.environ['GITHUB_SHA']}"
          Path('cloudflare-relay/wrangler.ci.json').write_text(json.dumps(src, indent=2) + '\n')
          PY
          grep -Fq "registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/stream-gateway:${GITHUB_SHA}" cloudflare-relay/wrangler.ci.json

      - name: Deploy Worker and discover public URL
        id: initial_deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-relay
          command: deploy --config wrangler.ci.json

      - name: Bootstrap persistent Worker secrets
        working-directory: cloudflare-relay
        env:
          PUBLIC_URL: ${{ steps.initial_deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PUBLIC_URL" ]] || { echo 'Wrangler did not return a deployment URL.'; exit 1; }
          PUBLIC_URL="${PUBLIC_URL%/}"
          echo "Discovered Cloudflare Worker URL: $PUBLIC_URL"

          secrets_json="$(npx --yes wrangler@latest secret list --config wrangler.ci.json)"

          ensure_secret() {
            local name="$1"
            local value="$2"
            if printf '%s' "$secrets_json" | grep -q '"name"[[:space:]]*:[[:space:]]*"'"$name"'"'; then
              echo "$name already exists; preserving it."
              return 0
            fi
            echo "Creating missing Worker secret: $name"
            printf '%s' "$value" | npx --yes wrangler@latest secret put "$name" --config wrangler.ci.json
            secrets_json="$(npx --yes wrangler@latest secret list --config wrangler.ci.json)"
          }

          ensure_secret GATEWAY_API_KEY "$(openssl rand -hex 64)"
          ensure_secret GATEWAY_CAPABILITY_KEY "$(openssl rand -hex 64)"
          ensure_secret RELAY_SIGNING_SECRET "$(openssl rand -hex 64)"
          ensure_secret RELAY_DEVICE_SECRET "$(openssl rand -hex 64)"
          ensure_secret TUNNEL_PROXY_BASE_URL "$PUBLIC_URL"

      - name: Redeploy Worker with persistent runtime secrets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-relay
          command: deploy --config wrangler.ci.json

      - name: Verify production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          echo "PUBLIC_GATEWAY_URL=$DEPLOYMENT_URL"
          for attempt in $(seq 1 16); do
            if curl --fail --silent --show-error --max-time 15 "$DEPLOYMENT_URL/health"; then
              echo
              echo 'Worker + Container health check passed.'
              exit 0
            fi
            echo "Health check attempt $attempt/16 failed; waiting 15s for Container provisioning..."
            sleep 15
          done
          echo 'Container health check did not become ready within the verification window.'
          exit 1

      - name: Inspect deployed Container applications
        working-directory: cloudflare-relay
        run: npx --yes wrangler@latest containers list
