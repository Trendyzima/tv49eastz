name: One-time unified feed UI integration patch
on:
  push:
    branches: [feature/native-tv49-social]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SocialActivity
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('tv-receiver/src/main/java/com/fadcam/tv/SocialActivity.java')
          s=p.read_text()
          s=s.replace('import com.fadcam.tv.social.SupabaseSocialRepository;', 'import com.fadcam.tv.social.SupabaseSocialRepository;\nimport com.fadcam.tv.social.UnifiedFeedRepository;')
          s=s.replace('private SupabaseSocialRepository repo;', 'private SupabaseSocialRepository repo;\n    private UnifiedFeedRepository unifiedRepo;\n    private String feedMode = "for_you";')
          s=s.replace('repo = new SupabaseSocialRepository(this); buildUi();', 'repo = new SupabaseSocialRepository(this); unifiedRepo = new UnifiedFeedRepository(this); buildUi();')
          s=s.replace('if ("For you".equals(selected) || "Following".equals(selected)) loadHome();', 'if ("For you".equals(selected) || "Following".equals(selected)) { feedMode = "Following".equals(selected) ? "following" : "for_you"; loadHome(); }')
          s=s.replace('repo.loadFeed(30, r ->', 'unifiedRepo.load(feedMode, 30, 0, r ->')
          s=s.replace('repo.loadTrending(30,r->runOnUiThread', 'unifiedRepo.load("for_you",30,0,r->runOnUiThread')
          s=s.replace('repo.loadTrending(20,r->runOnUiThread', 'unifiedRepo.load("for_you",30,0,r->runOnUiThread')
          s=re.sub(r'follow\.setOnClickListener\(v->repo\.followUser\(followUser\.getId\(\),true,feedback\("Following @"\+clean\(followUser\.getUsername\(\),"creator"\)\)\)\);', 'follow.setOnClickListener(v->{ if(followUser.getId()!=null && followUser.getId().startsWith("http")) unifiedRepo.follow(followUser,true,feedback("Following @"+clean(followUser.getUsername(),"creator"))); else repo.followUser(followUser.getId(),true,feedback("Following @"+clean(followUser.getUsername(),"creator"))); });', s)
          s=s.replace('repo.repostPost(p.getId(),true,feedback("Reposted"))', 'unifiedRepo.repost(p,true,feedback("Reposted"))')
          s=s.replace('repo.likePost(p.getId(),true,feedback("Liked"))', 'unifiedRepo.like(p,true,feedback("Liked"))')
          s=s.replace('repo.bookmarkPost(p.getId(),true,feedback("Saved"))', 'unifiedRepo.save(p,true,feedback("Saved"))')
          s=s.replace('private void addPost(SocialPost p){', 'private void addPost(SocialPost p){ unifiedRepo.recordEvent(p,"impression",0,feedback(""));')
          if 'UnifiedFeedRepository unifiedRepo' not in s or 'unifiedRepo.load(feedMode' not in s:
              raise SystemExit('required unified feed replacements did not apply')
          p.write_text(s)
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv-receiver/src/main/java/com/fadcam/tv/SocialActivity.java .github/workflows/one-time-unified-feed-patch.yml
          git diff --cached --quiet && { echo 'NO_CHANGES'; exit 1; } || true
          rm .github/workflows/one-time-unified-feed-patch.yml
          git add -u .github/workflows/one-time-unified-feed-patch.yml
          git commit -m 'feat(android): wire unified ranked federation feed'
          git push
