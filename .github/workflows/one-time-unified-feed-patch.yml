name: One-time unified feed integration patch
on:
  push:
    branches: [feature/native-tv49-social]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch native SocialActivity to consume unified ranking
        shell: python
        run: |
          from pathlib import Path
          p=Path('tv-receiver/src/main/java/com/fadcam/tv/SocialActivity.java')
          s=p.read_text()
          s=s.replace('import com.fadcam.tv.social.SupabaseSocialRepository;','import com.fadcam.tv.social.SupabaseSocialRepository;\nimport com.fadcam.tv.social.UnifiedFeedRepository;')
          s=s.replace('private SupabaseSocialRepository repo;','private SupabaseSocialRepository repo;\n    private UnifiedFeedRepository unifiedRepo;\n    private String feedMode = "for_you";')
          s=s.replace('repo = new SupabaseSocialRepository(this); buildUi();','repo = new SupabaseSocialRepository(this); unifiedRepo = new UnifiedFeedRepository(this); buildUi();')
          s=s.replace('if ("For you".equals(selected) || "Following".equals(selected)) loadHome();','if ("For you".equals(selected) || "Following".equals(selected)) { feedMode = "Following".equals(selected) ? "following" : "for_you"; loadHome(); }')
          s=s.replace('repo.loadFeed(30, r -> runOnUiThread(() -> {','unifiedRepo.load(feedMode, 30, 0, r -> runOnUiThread(() -> {')
          s=s.replace('repo.loadTrending(30,r->runOnUiThread(()->{List<SocialPost>posts=r.getValue()==null?new ArrayList<>():r.getValue();if(posts.isEmpty())addEmpty("Nothing is trending here yet.");else for(SocialPost p:posts)addPost(p);}));','unifiedRepo.load("for_you",30,0,r->runOnUiThread(()->{List<SocialPost>posts=r.getValue()==null?new ArrayList<>():r.getValue();if(posts.isEmpty())addEmpty("Nothing is trending here yet.");else for(SocialPost p:posts)addPost(p);}));')
          s=s.replace('repo.loadTrending(20,r->runOnUiThread(()->{if(r.getValue()!=null)for(SocialPost p:r.getValue())addPost(p);}));','unifiedRepo.load("for_you",30,0,r->runOnUiThread(()->{if(r.getValue()!=null)for(SocialPost p:r.getValue())addPost(p);}));')
          old='follow.setOnClickListener(v->repo.followUser(followUser.getId(),true,feedback("Following @"+clean(followUser.getUsername(),"creator"))));'
          new='follow.setOnClickListener(v->{ if(followUser.getId()!=null && followUser.getId().startsWith("http")) unifiedRepo.follow(followUser,true,feedback("Following @"+clean(followUser.getUsername(),"creator"))); else repo.followUser(followUser.getId(),true,feedback("Following @"+clean(followUser.getUsername(),"creator"))); });'
          s=s.replace(old,new)
          old='repost.setOnClickListener(v->repo.repostPost(p.getId(),true,feedback("Reposted")));'
          new='repost.setOnClickListener(v->unifiedRepo.repost(p,true,feedback("Reposted")));'
          s=s.replace(old,new)
          old='like.setOnClickListener(v->repo.likePost(p.getId(),true,feedback("Liked")));'
          new='like.setOnClickListener(v->unifiedRepo.like(p,true,feedback("Liked")));'
          s=s.replace(old,new)
          old='save.setOnClickListener(v->repo.bookmarkPost(p.getId(),true,feedback("Saved")));'
          new='save.setOnClickListener(v->unifiedRepo.save(p,true,feedback("Saved")));'
          s=s.replace(old,new)
          marker='private void addPost(SocialPost p){'
          s=s.replace(marker,marker+'unifiedRepo.recordEvent(p,"impression",0,feedback(""));')
          if 'private UnifiedFeedRepository unifiedRepo;' not in s or 'unifiedRepo.load(feedMode' not in s:
              raise SystemExit('unified feed patch assertions failed')
          p.write_text(s)
      - name: Remove one-time patch workflow
        run: |
          rm -f .github/workflows/one-time-unified-feed-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv-receiver/src/main/java/com/fadcam/tv/SocialActivity.java .github/workflows/one-time-unified-feed-patch.yml
          git commit -m 'feat(android): wire unified ranked federation feed' || exit 0
          git push
