name: One-shot repair invalid MainActivity splash installation

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'Trendyzima'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove duplicate SplashScreen installation from MainActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/fadcam/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          original = s
          s = s.replace('import androidx.core.splashscreen.SplashScreen; // SplashScreen API\n', '')
          s = s.replace('        // AndroidX requires splash installation before Activity.onCreate().\n        SplashScreen.installSplashScreen(this);\n', '')
          if s == original:
              raise SystemExit('Expected invalid MainActivity splash installation was not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove this one-shot workflow from the resulting tree
        shell: bash
        run: rm -f .github/workflows/repair-remove-invalid-mainactivity-splash-install.yml

      - name: Commit and push surgical repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/fadcam/MainActivity.java .github/workflows/repair-remove-invalid-mainactivity-splash-install.yml
          git commit -m 'Fix launch crash by removing duplicate MainActivity splash installation'
          git push origin HEAD:master
