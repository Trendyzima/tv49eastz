name: Device Tunnel

on:
  push:
    paths:
      - 'device-tunnel/**'
      - '.github/workflows/device-tunnel.yml'
  pull_request:
    paths:
      - 'device-tunnel/**'
      - '.github/workflows/device-tunnel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - agent
          - gateway
    defaults:
      run:
        working-directory: device-tunnel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: device-tunnel/go.mod
      - name: Format sources
        run: gofmt -w agent gateway
      - name: Test
        run: go test ./... -count=1 -race
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: '0'
