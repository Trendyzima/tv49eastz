name: Deploy TV49 East Cloudflare Edge

on:
  push:
    branches: [master]
    paths:
      - 'cloudflare-relay/**'
      - '.github/workflows/cloudflare-relay-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv49eastz-cloudflare-production-v2
  cancel-in-progress: false

env:
  # Production deploys must use the canonical master Wrangler configuration,
  # including the complete Durable Object migration history. Do not deploy
  # historical container-era configs from older commits.
  CLOUDFLARE_DEPLOY_ARCHITECTURE: native-relay

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare-relay
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare-relay/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      # Guard against accidentally deploying a historical Wrangler config that
      # omits already-applied Durable Object migrations.
      - name: Validate canonical Durable Object migration history
        run: |
          set -euo pipefail
          grep -q '"tag": "v1"' wrangler.jsonc
          grep -q '"tag": "v2"' wrangler.jsonc
          grep -q '"tag": "v3-cloud-run"' wrangler.jsonc
          grep -q '"tag": "v4-native-gateway"' wrangler.jsonc
          grep -q '"name": "SESSION_STORE"' wrangler.jsonc
          grep -q '"name": "RELAY_TUNNEL"' wrangler.jsonc
          echo 'Canonical Durable Object configuration validated.'

      # Runtime secrets are managed in Cloudflare. Do not mirror them through
      # GitHub Actions: an absent/renamed GitHub secret would otherwise abort
      # deployment or overwrite a valid Cloudflare secret with an empty value.
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-relay
          command: deploy --containers-rollout=immediate

      - name: Verify deployed Worker
        env:
          CF_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          [[ -n "$CF_URL" ]] || { echo 'Wrangler did not return a deployment URL'; exit 1; }
          echo "Deployed URL: $CF_URL"
          body="$(curl --silent --show-error --max-time 15 --fail "$CF_URL/health")"
          echo "$body"
          grep -q '"ok":true' <<<"$body"

      - name: Verify unauthenticated session rejection
        env:
          CF_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 -X POST "$CF_URL/v1/session")"
          [[ "$code" == 401 ]] || { echo "Expected 401, got $code"; exit 1; }
          echo 'Unauthenticated session rejection passed.'
