name: Deploy TV49 East Cloudflare Edge

on:
  push:
    branches: [master]
    paths:
      - 'cloudflare-relay/**'
      - 'supabase/migrations/**'
      - '.github/workflows/cloudflare-relay-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv49eastz-cloudflare-production-v4
  cancel-in-progress: false

env:
  CLOUDFLARE_DEPLOY_ARCHITECTURE: native-relay

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare-relay
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare-relay/package.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Validate canonical Durable Object migration history
        run: |
          set -euo pipefail
          grep -q '"tag": "v1"' wrangler.jsonc
          grep -q '"tag": "v2"' wrangler.jsonc
          grep -q '"tag": "v3-cloud-run"' wrangler.jsonc
          grep -q '"tag": "v4-native-gateway"' wrangler.jsonc
          grep -q '"name": "SESSION_STORE"' wrangler.jsonc
          grep -q '"name": "RELAY_TUNNEL"' wrangler.jsonc
      - name: Validate required GitHub Actions secrets are present
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$PAYPAL_CLIENT_ID" ]] || { echo 'Missing GitHub Actions secret: PAYPAL_CLIENT_ID'; exit 1; }
          [[ -n "$PAYPAL_CLIENT_SECRET" ]] || { echo 'Missing GitHub Actions secret: PAYPAL_CLIENT_SECRET'; exit 1; }
          [[ -n "$SUPABASE_SECRET_KEY" ]] || { echo 'Missing GitHub Actions secret: SUPABASE_SECRET_KEY'; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN'; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo 'Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          echo 'Required deployment credentials are provisioned in GitHub Actions secrets.'
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-relay
          command: deploy --containers-rollout=immediate
      - name: Resolve deployment URL
        id: deployment_url
        env:
          CF_URL_FROM_WRANGLER: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          cf_url="${CF_URL_FROM_WRANGLER:-https://tv49eastz-relay.nahashonnyaga794.workers.dev}"
          [[ "$cf_url" == https://* ]] || exit 1
          echo "cf_url=$cf_url" >> "$GITHUB_OUTPUT"
      - name: Provision server-side Supabase secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_SECRET_KEY" ]] || { echo 'SUPABASE_SECRET_KEY is empty'; exit 1; }
          printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SECRET_KEY
          echo 'Server-side Supabase secret provisioned without printing its value.'
      - name: Provision PayPal Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_ENV: ${{ secrets.PAYPAL_ENV }}
        run: |
          set -euo pipefail
          printf '%s' "$PAYPAL_CLIENT_ID" | npx wrangler secret put PAYPAL_CLIENT_ID
          printf '%s' "$PAYPAL_CLIENT_SECRET" | npx wrangler secret put PAYPAL_CLIENT_SECRET
          printf '%s' "${PAYPAL_ENV:-sandbox}" | npx wrangler secret put PAYPAL_ENV
      - name: Create or reuse PayPal webhook
        id: paypal_webhook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_ENV: ${{ secrets.PAYPAL_ENV }}
          CF_URL: ${{ steps.deployment_url.outputs.cf_url }}
        run: |
          set -euo pipefail
          base='https://api-m.sandbox.paypal.com'
          if [[ "${PAYPAL_ENV:-sandbox}" == 'live' || "${PAYPAL_ENV:-sandbox}" == 'production' ]]; then base='https://api-m.paypal.com'; fi
          token="$(curl --silent --show-error --fail --max-time 20 -u "$PAYPAL_CLIENT_ID:$PAYPAL_CLIENT_SECRET" -H 'Accept: application/json' -H 'Content-Type: application/x-www-form-urlencoded' --data 'grant_type=client_credentials' "$base/v1/oauth2/token" | jq -r '.access_token')"
          [[ -n "$token" && "$token" != 'null' ]] || exit 1
          webhook_url="$CF_URL/v1/paypal/webhook"
          existing_id="$(curl --silent --show-error --fail --max-time 20 -H "Authorization: Bearer $token" -H 'Accept: application/json' "$base/v1/notifications/webhooks?page_size=100" | jq -r --arg url "$webhook_url" '.webhooks[]? | select(.url == $url) | .id' | head -n1)"
          if [[ -z "$existing_id" ]]; then
            existing_id="$(curl --silent --show-error --fail --max-time 20 -X POST "$base/v1/notifications/webhooks" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$(jq -n --arg url "$webhook_url" '{url:$url,event_types:[{name:"CHECKOUT.ORDER.APPROVED"},{name:"PAYMENT.CAPTURE.COMPLETED"},{name:"PAYMENT.CAPTURE.DENIED"},{name:"PAYMENT.CAPTURE.REFUNDED"},{name:"PAYMENT.CAPTURE.REVERSED"}]}')" | jq -r '.id')"
          fi
          [[ -n "$existing_id" && "$existing_id" != 'null' ]] || exit 1
          printf '%s' "$existing_id" | npx wrangler secret put PAYPAL_WEBHOOK_ID
      - name: Verify production security, PayPal configuration and routing
        env:
          CF_URL: ${{ steps.deployment_url.outputs.cf_url }}
        run: |
          set -euo pipefail
          health="$(curl --silent --show-error --max-time 15 --fail "$CF_URL/health")"; grep -q '"ok":true' <<<"$health"
          paypal_config="$(curl --silent --show-error --max-time 15 --fail "$CF_URL/v1/paypal/config")"; grep -q '"provider":"paypal"' <<<"$paypal_config"; grep -q '"configured":true' <<<"$paypal_config"
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 -X POST "$CF_URL/v1/paypal/orders" -H 'Content-Type: application/json' --data '{"amount":"1.00","currency":"USD"}')"
          [[ "$code" == 401 ]] || { echo "Expected PayPal order without auth=401, got $code"; exit 1; }
          for path in /v1/session /v1/device/session /v1/media; do code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 -X POST "$CF_URL$path")"; [[ "$code" == 401 ]] || exit 1; done
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$CF_URL/stream/not-a-session/index.m3u8")"; [[ "$code" == 401 ]] || exit 1
          echo 'Cloudflare, PayPal configuration and unauthenticated payment/security checks passed.'
      - name: Publish deployment URL to job summary
        env:
          CF_URL: ${{ steps.deployment_url.outputs.cf_url }}
        run: 'echo "Production Worker endpoint: $CF_URL" >> "$GITHUB_STEP_SUMMARY"'
