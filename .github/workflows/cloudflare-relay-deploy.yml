name: Deploy TV49 East Cloudflare Edge

on:
  push:
    branches: [master]
    paths:
      - 'cloudflare-relay/**'
      - '.github/workflows/cloudflare-relay-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv49eastz-cloudflare-production-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare-relay
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare-relay/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        env:
          RELAY_SIGNING_SECRET: ${{ secrets.TV49_RELAY_SIGNING_SECRET }}
          RELAY_DEVICE_SECRET: ${{ secrets.TV49_RELAY_DEVICE_SECRET }}
          GATEWAY_API_KEY: ${{ secrets.TV49_GATEWAY_API_KEY }}
          GATEWAY_CAPABILITY_KEY: ${{ secrets.TV49_GATEWAY_CAPABILITY_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-relay
          command: deploy
          secrets: |
            RELAY_SIGNING_SECRET
            RELAY_DEVICE_SECRET
            GATEWAY_API_KEY
            GATEWAY_CAPABILITY_KEY

      - name: Verify deployed Worker
        env:
          CF_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          [[ -n "$CF_URL" ]] || { echo 'Wrangler did not return a deployment URL'; exit 1; }
          echo "Deployed URL: $CF_URL"
          body="$(curl --silent --show-error --max-time 15 --fail "$CF_URL/health")"
          echo "$body"
          grep -q '"ok":true' <<<"$body"

      - name: Verify unauthenticated session rejection
        env:
          CF_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 -X POST "$CF_URL/v1/session")"
          [[ "$code" == 401 ]] || { echo "Expected 401, got $code"; exit 1; }

      - name: Verify authenticated session creation and revocation
        env:
          CF_URL: ${{ steps.deploy.outputs.deployment-url }}
          GATEWAY_API_KEY: ${{ secrets.TV49_GATEWAY_API_KEY }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail --max-time 15 \
            -X POST "$CF_URL/v1/session" \
            -H "Authorization: Bearer $GATEWAY_API_KEY" \
            -H 'content-type: application/json' \
            --data '{"channel_id":"ci","stream_id":"ci-smoke"}')"
          echo "$response"
          session="$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.session||!x.ticket) process.exit(1); process.stdout.write(x.session)' "$response")"
          ticket="$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.ticket) process.exit(1); process.stdout.write(x.ticket)' "$response")"
          encoded_ticket="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$ticket")"
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$CF_URL/stream/$session/index.m3u8?ticket=$encoded_ticket")"
          [[ "$code" != "500" ]] || { echo 'Stream route crashed with HTTP 500'; exit 1; }
          revoke="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 -X DELETE "$CF_URL/v1/session/$session" -H "Authorization: Bearer $GATEWAY_API_KEY")"
          [[ "$revoke" == 204 ]] || { echo "Expected 204 on revoke, got $revoke"; exit 1; }
          echo 'Authenticated session create, stream authorization path, and revoke checks passed.'
