name: Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  MEDIA3_PATCHED_REPO: https://github.com/anonfaded/media3-patched.git
  MEDIA3_PATCHED_SHA: 6d498560637d273dcb754727c9dcdce97548e621
  MEDIA3_PATCHED_PATH: /tmp/media3-patched

jobs:
  verify:
    name: Production verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch pinned patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$MEDIA3_PATCHED_PATH"
          git init "$MEDIA3_PATCHED_PATH"
          git -C "$MEDIA3_PATCHED_PATH" remote add origin "$MEDIA3_PATCHED_REPO"
          git -C "$MEDIA3_PATCHED_PATH" fetch --depth 1 origin "$MEDIA3_PATCHED_SHA"
          git -C "$MEDIA3_PATCHED_PATH" checkout --detach FETCH_HEAD
          test "$(git -C "$MEDIA3_PATCHED_PATH" rev-parse HEAD)" = "$MEDIA3_PATCHED_SHA"
          test -f "$MEDIA3_PATCHED_PATH/libraries/muxer/src/main/java/androidx/media3/muxer/ProcessedSegment.java"
          test -d "$MEDIA3_PATCHED_PATH/libraries/common"
          test -d "$MEDIA3_PATCHED_PATH/libraries/container"
          test -d "$MEDIA3_PATCHED_PATH/libraries/muxer"
          printf '%s\n' "media3.patched.path=$MEDIA3_PATCHED_PATH" > local.properties
          chmod 600 local.properties

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Prepare Gradle
        run: |
          set -euo pipefail
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Verify Go components
        shell: bash
        run: |
          set -euo pipefail
          for dir in stream-catalog server-tap stream-gateway; do
            test -f "$dir/go.mod"
            (cd "$dir" && go test ./... -count=1 -race)
            (cd "$dir" && go vet ./...)
          done

      - name: Android unit tests
        run: ./gradlew --no-daemon --no-watch-fs --stacktrace testDefaultDebugUnitTest :tv-receiver:test

      - name: Verify patched Media3 substitution
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            "androidx.media3:media3-muxer :media3-patched:lib-muxer" \
            "androidx.media3:media3-common :media3-patched:lib-common" \
            "androidx.media3:media3-container :media3-patched:lib-container"; do
            set -- $spec
            ./gradlew --no-daemon --no-watch-fs --stacktrace :app:dependencyInsight --dependency "$1" --configuration defaultReleaseCompileClasspath | grep -Fq "project $2"
          done

      - name: Android release lint
        run: ./gradlew --no-daemon --no-watch-fs --stacktrace :app:lintDefaultRelease :tv-receiver:lintRelease

  release:
    name: Signed Android release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch pinned patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$MEDIA3_PATCHED_PATH"
          git init "$MEDIA3_PATCHED_PATH"
          git -C "$MEDIA3_PATCHED_PATH" remote add origin "$MEDIA3_PATCHED_REPO"
          git -C "$MEDIA3_PATCHED_PATH" fetch --depth 1 origin "$MEDIA3_PATCHED_SHA"
          git -C "$MEDIA3_PATCHED_PATH" checkout --detach FETCH_HEAD
          test "$(git -C "$MEDIA3_PATCHED_PATH" rev-parse HEAD)" = "$MEDIA3_PATCHED_SHA"
          test -f "$MEDIA3_PATCHED_PATH/libraries/muxer/src/main/java/androidx/media3/muxer/ProcessedSegment.java"
          printf '%s\n' "media3.patched.path=$MEDIA3_PATCHED_PATH" > local.properties
          chmod 600 local.properties

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Require release signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > /tmp/tv49eastz-release.jks
          chmod 600 /tmp/tv49eastz-release.jks
          printf '%s\n' \
            "KEYSTORE_FILE=/tmp/tv49eastz-release.jks" \
            "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" \
            "KEY_ALIAS=$KEY_ALIAS" \
            "KEY_PASSWORD=$KEY_PASSWORD" \
            "media3.patched.path=$MEDIA3_PATCHED_PATH" > local.properties
          chmod 600 local.properties
          keytool -list -keystore /tmp/tv49eastz-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed AAB and paired APKs
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-watch-fs --stacktrace \
            :app:bundleDefaultRelease \
            :app:assembleDefaultRelease \
            :tv-receiver:assembleRelease

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          aab="$(find app/build/outputs/bundle -type f -path '*/defaultRelease/*.aab' -print -quit)"
          fadcam="$(find app/build/outputs/apk -type f -path '*/default/release/*.apk' -print -quit)"
          tv="$(find tv-receiver/build/outputs/apk -type f -path '*/release/*.apk' -print -quit)"
          test -s "$aab" && test -s "$fadcam" && test -s "$tv"
          cp "$aab" dist/FadCam.aab
          cp "$fadcam" dist/FadCam.apk
          cp "$tv" dist/TV49East.apk
          printf '%s\n' "Collected: $aab" "Collected: $fadcam" "Collected: $tv"

      - name: Production APK security gate
        shell: bash
        env:
          EXPECTED_FADCAM_PACKAGE: com.fadcam
          EXPECTED_TV_PACKAGE: com.tv49.com
          EXPECTED_TARGET_SDK: '36'
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          apk_analyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit 2>/dev/null || true)"
          if [ -z "$apk_analyzer" ]; then
            apk_analyzer="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit 2>/dev/null || true)"
          fi
          test -n "$apk_analyzer" || { echo 'FAIL: Android apkanalyzer was not found'; exit 1; }

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n1)"
          test -n "$apksigner" || { echo 'FAIL: Android apksigner was not found'; exit 1; }

          report="dist/SECURITY-GATE.txt"
          : > "$report"
          printf '%s\n' 'TV 49 East production APK security gate' "Commit: $GITHUB_SHA" "Ref: $GITHUB_REF" "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$report"
          printf '%s\n' 'Policy: build -> signature -> scheme -> target SDK -> merged manifest -> forbidden permissions/aliases -> debuggable -> package ID -> SHA-256 -> publish' >> "$report"

          keystore_cert="$(keytool -list -v -keystore /tmp/tv49eastz-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | awk -F': ' '/^\s*SHA256:/{print $2; exit}')"
          test -n "$keystore_cert" || { echo 'FAIL: Could not read expected signing certificate from release keystore'; exit 1; }
          keystore_cert="${keystore_cert//:/}"
          keystore_cert="$(printf '%s' "$keystore_cert" | tr '[:lower:]' '[:upper:]')"
          printf '%s\n' "Expected signing certificate SHA-256: $keystore_cert" >> "$report"

          check_apk() {
            local apk="$1"
            local expected_package="$2"
            local label="$3"
            local manifest permissions app_id target_sdk debuggable certs aliases

            echo "===== $label ====="
            printf '%s\n' "[$label] $apk" >> "$report"

            test -s "$apk" || { echo "FAIL: $label APK is empty"; exit 1; }

            echo '1) Verify APK cryptographic signature'
            "$apksigner" verify --verbose -Werr "$apk"
            printf '%s\n' 'PASS: apksigner cryptographic verification' >> "$report"

            echo '2) Verify APK signature schemes (v2 + v3 required)'
            certs="$("$apksigner" verify --verbose --print-certs "$apk")"
            printf '%s\n' "$certs" | tee -a "$report"
            printf '%s\n' "$certs" | grep -Eq 'Verified using v2 scheme \(APK Signature Scheme v2\): true' || { echo "FAIL: $label is not signed with APK Signature Scheme v2"; exit 1; }
            printf '%s\n' "$certs" | grep -Eq 'Verified using v3 scheme \(APK Signature Scheme v3\): true' || { echo "FAIL: $label is not signed with APK Signature Scheme v3"; exit 1; }
            actual_cert="$(printf '%s\n' "$certs" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
            test -n "$actual_cert" || { echo "FAIL: $label signing certificate digest missing"; exit 1; }
            test "$actual_cert" = "$keystore_cert" || { echo "FAIL: $label is signed by an unexpected certificate"; exit 1; }
            printf '%s\n' 'PASS: v2 + v3 signature schemes and expected production certificate' >> "$report"

            echo '3) Inspect final merged manifest from the built APK'
            manifest="$("$apk_analyzer" manifest print "$apk")"
            printf '%s\n' "$manifest" > "dist/${label// /-}-merged-manifest.xml"
            permissions="$("$apk_analyzer" manifest permissions "$apk")"
            app_id="$("$apk_analyzer" manifest application-id "$apk")"
            target_sdk="$("$apk_analyzer" manifest target-sdk "$apk")"
            debuggable="$("$apk_analyzer" manifest debuggable "$apk")"
            aliases="$(printf '%s\n' "$manifest" | grep -E '<activity-alias([[:space:]>])' || true)"

            printf '%s\n' "application-id=$app_id" "target-sdk=$target_sdk" "debuggable=$debuggable" >> "$report"

            echo '4) Verify target SDK'
            test "$target_sdk" = "$EXPECTED_TARGET_SDK" || { echo "FAIL: $label target SDK is $target_sdk, expected $EXPECTED_TARGET_SDK"; exit 1; }
            printf '%s\n' "PASS: target SDK $EXPECTED_TARGET_SDK" >> "$report"

            echo '5) FAIL on MANAGE_EXTERNAL_STORAGE'
            if printf '%s\n' "$permissions" | grep -Fxq 'android.permission.MANAGE_EXTERNAL_STORAGE'; then
              echo "FAIL: $label declares MANAGE_EXTERNAL_STORAGE"
              exit 1
            fi
            printf '%s\n' 'PASS: MANAGE_EXTERNAL_STORAGE absent' >> "$report"

            echo '6) FAIL on battery-exemption permission'
            if printf '%s\n' "$permissions" | grep -Fxq 'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS'; then
              echo "FAIL: $label declares REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"
              exit 1
            fi
            if printf '%s\n' "$manifest" | grep -Fq 'android.settings.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS'; then
              echo "FAIL: $label contains ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS in its final manifest"
              exit 1
            fi
            printf '%s\n' 'PASS: battery-exemption permission/action absent' >> "$report"

            echo '7) FAIL on known deceptive launcher aliases'
            forbidden_aliases='AlternativeIcon|FadedIcon|PalestineIcon|PakistanIcon|FadSecLabIcon|NooristicIcon|BatIcon|RedBinaryIcon|NotesIcon|CalculatorIcon|ClockIcon|WeatherIcon|FootballIcon|CarIcon|JetIcon|MinimalIcon|BlackIcon'
            if printf '%s\n' "$aliases" | grep -Eq "$forbidden_aliases"; then
              echo "FAIL: $label contains a forbidden deceptive launcher alias"
              printf '%s\n' "$aliases"
              exit 1
            fi
            printf '%s\n' 'PASS: no known deceptive launcher aliases' >> "$report"

            echo '8) Verify release APK is not debuggable'
            test "$debuggable" = 'false' || { echo "FAIL: $label is debuggable=$debuggable"; exit 1; }
            printf '%s\n' 'PASS: debuggable=false' >> "$report"

            echo '9) Verify package/application ID'
            test "$app_id" = "$expected_package" || { echo "FAIL: $label application ID is $app_id, expected $expected_package"; exit 1; }
            printf '%s\n' "PASS: application ID $expected_package" >> "$report"

            echo '10) Record SHA-256 of final APK'
            sha256sum "$apk" | tee -a "$report"
            printf '%s\n' 'PASS: final APK SHA-256 recorded' >> "$report"
            echo "PASS: $label production security gate"
          }

          check_apk dist/FadCam.apk "$EXPECTED_FADCAM_PACKAGE" 'FadCam'
          check_apk dist/TV49East.apk "$EXPECTED_TV_PACKAGE" 'TV49East'

          echo 'Production APK security gate PASSED for both release APKs.'
          printf '%s\n' 'RESULT: PASS - both production APKs cleared every gate.' >> "$report"

      - name: Finalize release checksums and certificate report
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          sha256sum dist/FadCam.aab dist/FadCam.apk dist/TV49East.apk | tee dist/SHA256SUMS.txt
          keytool -list -v -keystore /tmp/tv49eastz-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep -E 'Owner:|SHA256:' > dist/RELEASE-CERTIFICATE.txt

      - name: Generate FadCam AAB provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/FadCam.aab'

      - name: Generate FadCam APK provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/FadCam.apk'

      - name: Generate TV 49 East APK provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/TV49East.apk'

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tv49east-production-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/FadCam.aab
            dist/FadCam.apk
            dist/TV49East.apk
            dist/SHA256SUMS.txt
            dist/RELEASE-CERTIFICATE.txt
            dist/SECURITY-GATE.txt
            dist/FadCam-merged-manifest.xml
            dist/TV49East-merged-manifest.xml

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/FadCam.apk \
            dist/TV49East.apk \
            dist/FadCam.aab \
            dist/SHA256SUMS.txt \
            dist/RELEASE-CERTIFICATE.txt \
            dist/SECURITY-GATE.txt \
            --verify-tag \
            --title "TV 49 East $GITHUB_REF_NAME" \
            --generate-notes
