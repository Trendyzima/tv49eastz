name: CDN Edge

on:
  push:
    paths:
      - 'cdn-edge/**'
      - '.github/workflows/cdn-edge.yml'
  pull_request:
    paths:
      - 'cdn-edge/**'
      - '.github/workflows/cdn-edge.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdn-edge
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Format
        run: gofmt -w .
      - name: Test
        run: go test ./... -count=1 -race
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath ./...
