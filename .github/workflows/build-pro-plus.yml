name: Build FadCam Pro+ APK (Custom)

on:
  workflow_dispatch:
    inputs:
      icon_base64:
        description: 'Icon image as base64 string (PNG/JPG)'
        required: true
        type: string
      app_name:
        description: 'Custom app name (max 50 chars, alphanumeric + spaces)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fadcam-pro-plus-build
  cancel-in-progress: true

env:
  MEDIA3_PATCHED_REPO: https://github.com/anonfaded/media3-patched.git
  MEDIA3_PATCHED_SHA: 6d498560637d273dcb754727c9dcdce97548e621
  MEDIA3_PATCHED_PATH: /tmp/media3-patched

jobs:
  build-pro-plus-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch pinned patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$MEDIA3_PATCHED_PATH"
          git init "$MEDIA3_PATCHED_PATH"
          git -C "$MEDIA3_PATCHED_PATH" remote add origin "$MEDIA3_PATCHED_REPO"
          git -C "$MEDIA3_PATCHED_PATH" fetch --depth 1 origin "$MEDIA3_PATCHED_SHA"
          git -C "$MEDIA3_PATCHED_PATH" checkout --detach FETCH_HEAD
          actual_sha="$(git -C "$MEDIA3_PATCHED_PATH" rev-parse HEAD)"
          test "$actual_sha" = "$MEDIA3_PATCHED_SHA"
          test -f "$MEDIA3_PATCHED_PATH/libraries/muxer/src/main/java/androidx/media3/muxer/ProcessedSegment.java"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install ImageMagick and WebP tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Validate and sanitize app name
        shell: bash
        env:
          APP_NAME_INPUT: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          APP_NAME="$APP_NAME_INPUT"
          [ "${#APP_NAME}" -le 50 ] || { echo "App name exceeds 50 characters"; exit 1; }
          SANITIZED=$(printf '%s' "$APP_NAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed 's/[^a-zA-Z0-9 -]//g')
          [ -n "$SANITIZED" ] || { echo "App name contains no permitted characters"; exit 1; }
          echo "FINAL_APP_NAME=$SANITIZED" >> "$GITHUB_ENV"

      - name: Decode and validate icon
        shell: bash
        env:
          ICON_BASE64: ${{ inputs.icon_base64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ICON_BASE64" | base64 --decode > /tmp/icon_temp.png
          file /tmp/icon_temp.png | grep -q 'image'
          DIMENSIONS=$(identify -format '%wx%h' /tmp/icon_temp.png)
          WIDTH=${DIMENSIONS%x*}
          HEIGHT=${DIMENSIONS#*x}
          [ "$WIDTH" -ge 192 ] && [ "$HEIGHT" -ge 192 ] || { echo "Icon must be at least 192x192"; exit 1; }

      - name: Process icon assets
        shell: bash
        run: |
          set -euo pipefail
          SIZES=(48 72 96 144 192)
          DENSITY_NAMES=(mdpi hdpi xhdpi xxhdpi xxxhdpi)
          mkdir -p /tmp/icons_webp
          for i in "${!SIZES[@]}"; do
            SIZE=${SIZES[$i]}; DENSITY=${DENSITY_NAMES[$i]}
            magick /tmp/icon_temp.png -resize "${SIZE}x${SIZE}!" -gravity center -extent "${SIZE}x${SIZE}" "/tmp/icons_webp/ic_launcher_${DENSITY}.webp"
            MIPMAP_DIR="app/src/main/res/mipmap-${DENSITY}"
            if [ -d "$MIPMAP_DIR" ]; then
              cp "/tmp/icons_webp/ic_launcher_${DENSITY}.webp" "$MIPMAP_DIR/ic_launcher_foreground.webp"
              cp "/tmp/icons_webp/ic_launcher_${DENSITY}.webp" "$MIPMAP_DIR/ic_launcher.webp"
            fi
          done

      - name: Setup local.properties with release keystore
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD secret is required}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is required}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is required}"
          printf '%s\n' "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" "KEY_ALIAS=$KEY_ALIAS" "KEY_PASSWORD=$KEY_PASSWORD" > local.properties
          chmod 600 local.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Decode and validate keystore
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 secret is required}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Build Pro+ APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-watch-fs --stacktrace assembleProPlus -PcustomAppName="$FINAL_APP_NAME"

      - name: Verify APK was built
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/default/proPlus -maxdepth 1 -type f -name '*.apk' -print 2>/dev/null)
          [ "${#apks[@]}" -eq 1 ] || { printf 'Expected exactly one Pro+ APK, found %s\n' "${#apks[@]}"; printf '%s\n' "${apks[@]}"; exit 1; }
          test -s "${apks[0]}"
          echo "✓ ${apks[0]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fadcam-pro-plus-apk
          path: app/build/outputs/apk/default/proPlus/*.apk
          if-no-files-found: error
          retention-days: 7
