name: Build FadCam Pro+ APK (Custom)

on:
  workflow_dispatch:
    inputs:
      icon_base64:
        description: 'Icon image as base64 string (PNG/JPG)'
        required: true
        type: string
      app_name:
        description: 'Custom app name (max 50 chars, alphanumeric + spaces)'
        required: true
        type: string

jobs:
  build-pro-plus-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone patched Media3 for live streaming
        run: git clone --depth 1 https://github.com/anonfaded/media3-patched.git /tmp/media3-patched

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Install ImageMagick and WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Validate and sanitize app name
        run: |
          set -euo pipefail
          APP_NAME="${{ inputs.app_name }}"
          if [ ${#APP_NAME} -gt 50 ]; then exit 1; fi
          SANITIZED=$(printf '%s' "$APP_NAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed 's/[^a-zA-Z0-9 -]//g')
          [ -n "$SANITIZED" ] || exit 1
          echo "FINAL_APP_NAME=$SANITIZED" >> "$GITHUB_ENV"

      - name: Decode and validate icon
        run: |
          set -euo pipefail
          printf '%s' "${{ inputs.icon_base64 }}" | base64 --decode > /tmp/icon_temp.png
          file /tmp/icon_temp.png | grep -q 'image'
          DIMENSIONS=$(identify -format '%wx%h' /tmp/icon_temp.png)
          WIDTH=${DIMENSIONS%x*}
          HEIGHT=${DIMENSIONS#*x}
          [ "$WIDTH" -ge 192 ] && [ "$HEIGHT" -ge 192 ]

      - name: Process icon assets
        run: |
          set -euo pipefail
          SIZES=(48 72 96 144 192)
          DENSITY_NAMES=(mdpi hdpi xhdpi xxhdpi xxxhdpi)
          mkdir -p /tmp/icons_webp
          for i in "${!SIZES[@]}"; do
            SIZE=${SIZES[$i]}; DENSITY=${DENSITY_NAMES[$i]}
            magick /tmp/icon_temp.png -resize "${SIZE}x${SIZE}!" -gravity center -extent "${SIZE}x${SIZE}" "/tmp/icons_webp/ic_launcher_${DENSITY}.webp"
            MIPMAP_DIR="app/src/main/res/mipmap-${DENSITY}"
            if [ -d "$MIPMAP_DIR" ]; then
              cp "/tmp/icons_webp/ic_launcher_${DENSITY}.webp" "$MIPMAP_DIR/ic_launcher_foreground.webp"
              cp "/tmp/icons_webp/ic_launcher_${DENSITY}.webp" "$MIPMAP_DIR/ic_launcher.webp"
            fi
          done

      - name: Setup local.properties with release keystore
        run: |
          set -euo pipefail
          printf '%s\n' "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> local.properties
          printf '%s\n' "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> local.properties
          printf '%s\n' "KEY_ALIAS=${KEY_ALIAS}" >> local.properties
          printf '%s\n' "KEY_PASSWORD=${KEY_PASSWORD}" >> local.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Decode and validate keystore
        run: |
          set -euo pipefail
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Build Pro+ APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleProPlus -PcustomAppName="${FINAL_APP_NAME}"

      - name: Verify APK was built
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/default/proPlus/FadCam_v4.0.0-Pro+-arm64-v8a.apk'
          test -s "$apk"
          echo "✓ $apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fadcam-pro-plus-apk
          path: app/build/outputs/apk/default/proPlus/FadCam_v4.0.0-Pro+-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7
