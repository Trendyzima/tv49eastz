name: One-shot MainActivity launch repair

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair SplashScreen ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/fadcam/MainActivity.java')
          s = p.read_text()
          old = '''        super.onCreate(savedInstanceState);\n        swipeTouchSlop = ViewConfiguration.get(this).getScaledTouchSlop();\n        // Install splash screen (shows the themed windowSplashScreenAnimatedIcon)\n        SplashScreen.installSplashScreen(this);'''
          new = '''        // AndroidX requires splash installation before Activity.onCreate().\n        SplashScreen.installSplashScreen(this);\n        super.onCreate(savedInstanceState);\n        swipeTouchSlop = ViewConfiguration.get(this).getScaledTouchSlop();'''
          if old not in s:
              raise SystemExit('Expected unsafe SplashScreen ordering was not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-mainactivity-splash-order.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/fadcam/MainActivity.java .github/workflows/repair-mainactivity-splash-order.yml
          git commit -m 'Fix MainActivity SplashScreen initialization order'
          git push origin HEAD:master
