name: Secure Stream Stack

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - device-tunnel
          - server-tap
          - stream-gateway
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          files=$(find . -name '*.go' -type f -print)
          test -n "$files"
          unformatted=$(gofmt -l $files)
          if [[ -n "$unformatted" ]]; then
            echo "Unformatted Go files:"
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Unit and security tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
