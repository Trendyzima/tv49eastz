name: Secure Stream Stack

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - device-tunnel
          - server-tap
          - stream-gateway
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t go_files < <(find . -type f -name '*.go' -print)
          if ((${#go_files[@]} == 0)); then
            echo 'No Go files found.'
            exit 1
          fi
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            echo 'Unformatted Go files:'
            printf '%s\n' "${unformatted}"
            echo 'Run gofmt -w on the listed files and commit the result.'
            exit 1
          fi
      - name: Unit and security tests
        run: go test ./... -count=1
      - name: Race tests
        run: go test -race ./... -count=1
      - name: Vet
        run: go vet ./...
