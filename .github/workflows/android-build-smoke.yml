name: Android Build Certification

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-build-certification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MEDIA3_PATCHED_REPO: https://github.com/anonfaded/media3-patched.git
  MEDIA3_PATCHED_SHA: 6d498560637d273dcb754727c9dcdce97548e621
  MEDIA3_PATCHED_PATH: /tmp/media3-patched

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Fetch pinned patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${MEDIA3_PATCHED_PATH}"
          git init "${MEDIA3_PATCHED_PATH}"
          git -C "${MEDIA3_PATCHED_PATH}" remote add origin "${MEDIA3_PATCHED_REPO}"
          git -C "${MEDIA3_PATCHED_PATH}" fetch --depth 1 origin "${MEDIA3_PATCHED_SHA}"
          git -C "${MEDIA3_PATCHED_PATH}" checkout --detach FETCH_HEAD
          actual_sha="$(git -C "${MEDIA3_PATCHED_PATH}" rev-parse HEAD)"
          test "${actual_sha}" = "${MEDIA3_PATCHED_SHA}"
          echo "Pinned Media3 commit: ${actual_sha}"

      - name: Verify patched Media3 build input
        shell: bash
        run: |
          set -euo pipefail
          test -f "${MEDIA3_PATCHED_PATH}/libraries/muxer/src/main/java/androidx/media3/muxer/ProcessedSegment.java"
          test -d "${MEDIA3_PATCHED_PATH}/libraries/common"
          test -d "${MEDIA3_PATCHED_PATH}/libraries/container"
          test -d "${MEDIA3_PATCHED_PATH}/libraries/muxer"
          test -f "${MEDIA3_PATCHED_PATH}/core_settings.gradle"
          grep -Fq "include modulePrefix + 'lib-common'" "${MEDIA3_PATCHED_PATH}/core_settings.gradle"
          grep -Fq "include modulePrefix + 'lib-container'" "${MEDIA3_PATCHED_PATH}/core_settings.gradle"
          grep -Fq "include modulePrefix + 'lib-muxer'" "${MEDIA3_PATCHED_PATH}/core_settings.gradle"
          echo 'Patched Media3 invariant satisfied.'

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Discover Android variants
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-watch-fs :app:tasks --all > /tmp/android-tasks.txt
          for task in \
            testDefaultDebugUnitTest \
            assembleDefaultDebug \
            assembleDefaultRelease \
            assembleNotesProRelease \
            assembleCalcProRelease \
            assembleWeatherProRelease \
            assembleDefaultProPlusRelease \
            bundleDefaultRelease \
            bundleDefaultProPlusRelease; do
            grep -Fq "$task" /tmp/android-tasks.txt || {
              echo "Required Android task not exposed: $task"
              grep -E 'test.*UnitTest|assemble.*(Debug|Release)|bundle.*Release' /tmp/android-tasks.txt || true
              exit 1
            }
          done
          echo 'Required Android certification task set is present.'

      - name: Verify Gradle composite substitutions
        shell: bash
        run: |
          set -euo pipefail
          verify_substitution() {
            local module="$1"
            local project="$2"
            local output="/tmp/${module//:/-}-dependency.txt"
            ./gradlew --no-daemon --no-watch-fs --stacktrace \
              :app:dependencyInsight \
              --dependency "${module}" \
              --configuration defaultDebugCompileClasspath >"${output}" 2>&1
            grep -Fq "${module}" "${output}"
            grep -Fq "${module}:1.8.0 -> project ${project}" "${output}"
            echo "PASS: ${module} -> ${project}"
          }
          verify_substitution "androidx.media3:media3-muxer" ":media3-patched:lib-muxer"
          verify_substitution "androidx.media3:media3-common" ":media3-patched:lib-common"
          verify_substitution "androidx.media3:media3-container" ":media3-patched:lib-container"

      - name: Run default debug unit tests
        run: ./gradlew --no-daemon --no-watch-fs --stacktrace testDefaultDebugUnitTest

      - name: Assemble Android APK variants
        run: |
          ./gradlew --no-daemon --no-watch-fs --stacktrace \
            assembleDefaultDebug \
            assembleDefaultRelease \
            assembleNotesProRelease \
            assembleCalcProRelease \
            assembleWeatherProRelease \
            assembleDefaultProPlusRelease

      - name: Assemble Android bundles
        run: |
          ./gradlew --no-daemon --no-watch-fs --stacktrace \
            bundleDefaultRelease \
            bundleDefaultProPlusRelease

      - name: Verify Android artifacts and native alignment
        shell: bash
        run: |
          set -euo pipefail
          command -v zipalign >/dev/null
          command -v readelf >/dev/null

          apk_count=0
          bundle_count=0
          while IFS= read -r -d '' apk; do
            test -s "$apk"
            echo "APK: $apk"
            zipalign -c -P 16 -v 4 "$apk"

            tmp="$(mktemp -d)"
            unzip -q "$apk" 'lib/*/*.so' -d "$tmp"
            while IFS= read -r -d '' so; do
              echo "ELF: $so"
              if ! python3 - "$so" <<'PY'
import struct
import sys

path = sys.argv[1]
data = open(path, 'rb').read()
if data[:4] != b'\x7fELF':
    raise SystemExit(f'not an ELF file: {path}')

klass = data[4]
endian = '<' if data[5] == 1 else '>' if data[5] == 2 else None
if endian is None:
    raise SystemExit(f'unknown ELF endianness: {path}')

if klass == 2:
    e_phoff = struct.unpack_from(endian + 'Q', data, 32)[0]
    e_phentsize = struct.unpack_from(endian + 'H', data, 54)[0]
    e_phnum = struct.unpack_from(endian + 'H', data, 56)[0]
    fmt = endian + 'IIQQQQQQ'
    align_index = 7
else:
    e_phoff = struct.unpack_from(endian + 'I', data, 28)[0]
    e_phentsize = struct.unpack_from(endian + 'H', data, 42)[0]
    e_phnum = struct.unpack_from(endian + 'H', data, 44)[0]
    fmt = endian + 'IIIIIIII'
    align_index = 7

load = []
for i in range(e_phnum):
    off = e_phoff + i * e_phentsize
    fields = struct.unpack_from(fmt, data, off)
    if fields[0] == 1:  # PT_LOAD
        align = fields[align_index]
        load.append(align)

if not load:
    raise SystemExit(f'no PT_LOAD segments: {path}')

for align in load:
    print(f'PT_LOAD alignment: 0x{align:x}')
    if align < 0x4000:
        raise SystemExit(f'PT_LOAD alignment below 16 KiB: 0x{align:x}: {path}')
PY
              then
                echo "FAIL: native 16 KiB ELF alignment: $so"
                exit 1
              fi
            done < <(find "$tmp/lib" -type f -name '*.so' -print0)
            rm -rf "$tmp"
            apk_count=$((apk_count + 1))
          done < <(find app/build/outputs/apk -type f -name '*.apk' -print0)

          while IFS= read -r -d '' aab; do
            test -s "$aab"
            echo "AAB: $aab"
            bundle_count=$((bundle_count + 1))
          done < <(find app/build/outputs/bundle -type f -name '*.aab' -print0)

          test "$apk_count" -ge 6
          test "$bundle_count" -ge 2
          echo "Certified artifact counts: ${apk_count} APK(s), ${bundle_count} AAB(s)."

      - name: Generate artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="app-build-manifest.txt"
          {
            echo "Commit: $GITHUB_SHA"
            echo "Media3 commit: ${MEDIA3_PATCHED_SHA}"
            echo "Java: $(java -version 2>&1 | head -n 1)"
            echo "Gradle: $(./gradlew --version | grep '^Gradle ' | head -n 1)"
            echo
            echo 'Artifacts:'
            find app/build/outputs/apk app/build/outputs/bundle \
              -type f \( -name '*.apk' -o -name '*.aab' \) \
              -printf '%p %s bytes\n' | sort
          } > "$manifest"
          cat "$manifest"
          echo '## Android certification' >> "$GITHUB_STEP_SUMMARY"
          echo 'All required variants assembled and artifact checks completed.' >> "$GITHUB_STEP_SUMMARY"
          cat "$manifest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload certified Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-certified-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
            app-build-manifest.txt
          if-no-files-found: error
          retention-days: 7
