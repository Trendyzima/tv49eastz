name: Android Build Certification

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-build-certification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MEDIA3_PATCHED_REPO: https://github.com/anonfaded/media3-patched.git
  MEDIA3_PATCHED_SHA: 6d498560637d273dcb754727c9dcdce97548e621
  MEDIA3_PATCHED_PATH: /tmp/media3-patched
  CI_KEYSTORE_PATH: /tmp/tv49eastz-ci-release.jks
  CI_KEYSTORE_PASSWORD: changeit-ci-only
  CI_KEY_ALIAS: tv49eastz-ci
  CI_KEY_PASSWORD: changeit-ci-only

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch pinned patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$MEDIA3_PATCHED_PATH"
          git init "$MEDIA3_PATCHED_PATH"
          git -C "$MEDIA3_PATCHED_PATH" remote add origin "$MEDIA3_PATCHED_REPO"
          git -C "$MEDIA3_PATCHED_PATH" fetch --depth 1 origin "$MEDIA3_PATCHED_SHA"
          git -C "$MEDIA3_PATCHED_PATH" checkout --detach FETCH_HEAD
          actual_sha="$(git -C "$MEDIA3_PATCHED_PATH" rev-parse HEAD)"
          test "$actual_sha" = "$MEDIA3_PATCHED_SHA"
          test -f "$MEDIA3_PATCHED_PATH/libraries/muxer/src/main/java/androidx/media3/muxer/ProcessedSegment.java"
          test -d "$MEDIA3_PATCHED_PATH/libraries/common"
          test -d "$MEDIA3_PATCHED_PATH/libraries/container"
          test -d "$MEDIA3_PATCHED_PATH/libraries/muxer"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Prepare CI release signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$CI_KEYSTORE_PATH"
          keytool -genkeypair -noprompt -keystore "$CI_KEYSTORE_PATH" -storepass "$CI_KEYSTORE_PASSWORD" -keypass "$CI_KEY_PASSWORD" -alias "$CI_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname "CN=tv49eastz CI,O=tv49eastz,C=XX"
          chmod 600 "$CI_KEYSTORE_PATH"
          printf '%s\n' "KEYSTORE_FILE=$CI_KEYSTORE_PATH" "KEYSTORE_PASSWORD=$CI_KEYSTORE_PASSWORD" "KEY_ALIAS=$CI_KEY_ALIAS" "KEY_PASSWORD=$CI_KEY_PASSWORD" > local.properties
          chmod 600 local.properties

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Discover and verify required Android tasks
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-watch-fs :app:tasks --all > /tmp/app-tasks.txt
          for task in testDefaultDebugUnitTest assembleDefaultDebug assembleDefaultRelease assembleNotesProRelease assembleCalcProRelease assembleWeatherProRelease assembleProPlus; do
            grep -Fq "$task" /tmp/app-tasks.txt || { echo "Required Android task not exposed: $task"; exit 1; }
          done
          ./gradlew --no-daemon --no-watch-fs :tv-receiver:tasks --all > /tmp/tv-tasks.txt
          for task in testDebugUnitTest assembleDebug assembleRelease; do
            grep -Fq "$task" /tmp/tv-tasks.txt || { echo "Required TV task not exposed: $task"; exit 1; }
          done

      - name: Verify patched Media3 substitution
        shell: bash
        run: |
          set -euo pipefail
          verify_substitution() {
            local module="$1" project="$2" output="/tmp/${1//:/-}-dependency.txt"
            ./gradlew --no-daemon --no-watch-fs --stacktrace :app:dependencyInsight --dependency "$module" --configuration defaultDebugCompileClasspath >"$output" 2>&1 || { cat "$output"; exit 1; }
            grep -Fq "project $project" "$output" || { cat "$output"; echo "FAIL: $module was not substituted by $project"; exit 1; }
          }
          verify_substitution "androidx.media3:media3-muxer" ":media3-patched:lib-muxer"
          verify_substitution "androidx.media3:media3-common" ":media3-patched:lib-common"
          verify_substitution "androidx.media3:media3-container" ":media3-patched:lib-container"

      - name: Run Android unit tests
        run: ./gradlew --no-daemon --no-watch-fs --stacktrace testDefaultDebugUnitTest :tv-receiver:test

      - name: Assemble FadCam APK variants
        shell: bash
        run: ./gradlew assembleDefaultDebug assembleDefaultRelease assembleNotesProRelease assembleCalcProRelease assembleWeatherProRelease assembleProPlus --no-daemon --no-watch-fs --stacktrace

      - name: Assemble TV receiver APK variants
        shell: bash
        run: ./gradlew :tv-receiver:assembleDebug :tv-receiver:assembleRelease --no-daemon --no-watch-fs --stacktrace

      - name: Resolve Android SDK build-tools
        id: android-tools
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk" && test -d "$sdk" || { echo "ERROR: Android SDK root is unavailable"; exit 1; }
          build_tools="$sdk/build-tools"
          test -d "$build_tools" || { echo "ERROR: Android SDK build-tools directory is unavailable: $build_tools"; exit 1; }

          # Do not assign through a while-loop fed by process substitution: that
          # loop executes in a subshell in bash and the selected path is lost.
          mapfile -t zipalign_candidates < <(
            find "$build_tools" -mindepth 2 -maxdepth 2 -type f -name zipalign -perm -111 -print 2>/dev/null \
              | sort -t/ -k1,1 -k2,2V -r
          )

          zipalign=""
          for candidate in "${zipalign_candidates[@]}"; do
            if [[ -x "$candidate" ]]; then
              zipalign="$candidate"
              break
            fi
          done

          if [[ -z "$zipalign" ]]; then
            echo "ERROR: no executable zipalign found under $build_tools"
            find "$build_tools" -type f -name zipalign -print 2>/dev/null || true
            ls -la "$build_tools" 2>/dev/null || true
            exit 1
          fi

          echo "Using zipalign: $zipalign"
          "$zipalign" version
          echo "zipalign=$zipalign" >> "$GITHUB_OUTPUT"

      - name: Verify APK artifacts
        shell: bash
        env:
          ZIPALIGN: ${{ steps.android-tools.outputs.zipalign }}
        run: |
          set -euo pipefail
          test -n "$ZIPALIGN"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" version
          apk_count=0
          while IFS= read -r -d '' apk; do
            test -s "$apk"
            echo "Checking APK: $apk"
            "$ZIPALIGN" -c -P 16 -v 4 "$apk"
            echo "CERTIFIED: $apk"
            apk_count=$((apk_count + 1))
          done < <(find app/build/outputs/apk tv-receiver/build/outputs/apk -type f -name '*.apk' -print0)
          test "$apk_count" -ge 8 || { echo "Expected at least 8 APKs, found $apk_count"; find app/build/outputs/apk tv-receiver/build/outputs/apk -type f -name '*.apk' -print || true; exit 1; }
          echo "Certified APK count: $apk_count"

      - name: Generate certification manifest
        shell: bash
        run: |
          set -euo pipefail
          { echo "Repository: $GITHUB_REPOSITORY"; echo "Commit: $GITHUB_SHA"; echo "Media3 commit: $MEDIA3_PATCHED_SHA"; echo "Java: $(java -version 2>&1 | head -n 1)"; echo "Gradle: $(./gradlew --version | grep '^Gradle ' | head -n 1)"; echo; echo "Artifacts:"; find app/build/outputs/apk tv-receiver/build/outputs/apk -type f -name '*.apk' -printf '%p %s bytes\n' | sort; } > android-certification-manifest.txt
          cat android-certification-manifest.txt
          cat android-certification-manifest.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload certified APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-certified-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            app/build/outputs/apk/**/*.apk
            tv-receiver/build/outputs/apk/**/*.apk
            android-certification-manifest.txt
