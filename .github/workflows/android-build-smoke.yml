name: Android Build Certification

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-build-certification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MEDIA3_PATCHED_REPO: https://github.com/anonfaded/media3-patched.git
  MEDIA3_PATCHED_SHA: 6d498560637d273dcb754727c9dcdce97548e621
  MEDIA3_PATCHED_PATH: /tmp/media3-patched
  CI_KEYSTORE_PATH: /tmp/tv49eastz-ci-release.jks
  CI_KEYSTORE_PASSWORD: changeit-ci-only
  CI_KEY_ALIAS: tv49eastz-ci
  CI_KEY_PASSWORD: changeit-ci-only

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch pinned patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$MEDIA3_PATCHED_PATH"
          git init "$MEDIA3_PATCHED_PATH"
          git -C "$MEDIA3_PATCHED_PATH" remote add origin "$MEDIA3_PATCHED_REPO"
          git -C "$MEDIA3_PATCHED_PATH" fetch --depth 1 origin "$MEDIA3_PATCHED_SHA"
          git -C "$MEDIA3_PATCHED_PATH" checkout --detach FETCH_HEAD
          actual_sha="$(git -C "$MEDIA3_PATCHED_PATH" rev-parse HEAD)"
          test "$actual_sha" = "$MEDIA3_PATCHED_SHA"
          test -f "$MEDIA3_PATCHED_PATH/libraries/muxer/src/main/java/androidx/media3/muxer/ProcessedSegment.java"
          echo "Pinned Media3: $actual_sha"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Prepare CI release signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$CI_KEYSTORE_PATH"
          keytool -genkeypair -noprompt \
            -keystore "$CI_KEYSTORE_PATH" \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=tv49eastz CI,O=tv49eastz,C=XX"
          chmod 600 "$CI_KEYSTORE_PATH"
          cat > local.properties <<EOF
KEYSTORE_FILE=$CI_KEYSTORE_PATH
KEYSTORE_PASSWORD=$CI_KEYSTORE_PASSWORD
KEY_ALIAS=$CI_KEY_ALIAS
KEY_PASSWORD=$CI_KEY_PASSWORD
EOF
          chmod 600 local.properties
          test -s "$CI_KEYSTORE_PATH"
          test -s local.properties

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Discover and verify required Android tasks
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-watch-fs :app:tasks --all > /tmp/app-tasks.txt
          for task in \
            testDefaultDebugUnitTest \
            assembleDefaultDebug \
            assembleDefaultRelease \
            assembleNotesProRelease \
            assembleCalcProRelease \
            assembleWeatherProRelease \
            assembleProPlus; do
            grep -Fq "$task" /tmp/app-tasks.txt || {
              echo "Required Android task not exposed: $task"
              echo "--- matching Android assemble/test tasks ---"
              grep -E '(^|:)assemble|test.*UnitTest' /tmp/app-tasks.txt | head -n 160 || true
              exit 1
            }
          done
          ./gradlew --no-daemon --no-watch-fs :tv-receiver:tasks --all > /tmp/tv-tasks.txt
          for task in testDebugUnitTest assembleDebug assembleRelease; do
            grep -Fq "$task" /tmp/tv-tasks.txt || {
              echo "Required TV task not exposed: $task"
              exit 1
            }
          done

      - name: Verify patched Media3 substitution
        shell: bash
        run: |
          set -euo pipefail
          verify_substitution() {
            local module="$1"
            local project="$2"
            local output="/tmp/${module//:/-}-dependency.txt"
            echo "Checking ${module} -> ${project}"
            if ! ./gradlew --no-daemon --no-watch-fs --stacktrace \
              :app:dependencyInsight \
              --dependency "$module" \
              --configuration defaultDebugCompileClasspath >"$output" 2>&1; then
              cat "$output"
              echo "FAIL: dependencyInsight failed for $module"
              exit 1
            fi
            cat "$output"
            grep -Fq "project $project" "$output" || {
              echo "FAIL: $module was not substituted by $project"
              echo "--- resolved Media3 projects ---"
              grep -E 'project :media3-patched:lib-' "$output" || true
              exit 1
            }
            echo "PASS: $module -> $project"
          }
          verify_substitution "androidx.media3:media3-muxer" ":media3-patched:lib-muxer"
          verify_substitution "androidx.media3:media3-common" ":media3-patched:lib-common"
          verify_substitution "androidx.media3:media3-container" ":media3-patched:lib-container"

      - name: Run Android unit tests
        run: ./gradlew --no-daemon --no-watch-fs --stacktrace testDefaultDebugUnitTest :tv-receiver:test

      - name: Assemble FadCam APK variants
        run: |
          ./gradlew --no-daemon --no-watch-fs --stacktrace \
            assembleDefaultDebug \
            assembleDefaultRelease \
            assembleNotesProRelease \
            assembleCalcProRelease \
            assembleWeatherProRelease \
            assembleProPlus

      - name: Assemble TV receiver APK variants
        run: ./gradlew --no-daemon --no-watch-fs --stacktrace \
          :tv-receiver:assembleDebug :tv-receiver:assembleRelease

      - name: Verify APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          command -v zipalign >/dev/null || { echo "zipalign not installed"; exit 1; }
          apk_count=0
          while IFS= read -r -d '' apk; do
            test -s "$apk"
            echo "Checking APK: $apk"
            zipalign -c -P 16 -v 4 "$apk"
            echo "CERTIFIED: $apk"
            apk_count=$((apk_count + 1))
          done < <(find app/build/outputs/apk tv-receiver/build/outputs/apk -type f -name '*.apk' -print0)
          test "$apk_count" -ge 8 || {
            echo "Expected at least 8 APKs, found $apk_count"
            find app/build/outputs/apk tv-receiver/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          }
          echo "Certified APK count: $apk_count"

      - name: Generate certification manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Media3 commit: $MEDIA3_PATCHED_SHA"
            echo "Java: $(java -version 2>&1 | head -n 1)"
            echo "Gradle: $(./gradlew --version | grep '^Gradle ' | head -n 1)"
            echo
            echo "Artifacts:"
            find app/build/outputs/apk tv-receiver/build/outputs/apk -type f -name '*.apk' -printf '%p %s bytes\n' | sort
          } > android-certification-manifest.txt
          cat android-certification-manifest.txt
          cat android-certification-manifest.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload certified APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-certified-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            app/build/outputs/apk/**/*.apk
            tv-receiver/build/outputs/apk/**/*.apk
            android-certification-manifest.txt
