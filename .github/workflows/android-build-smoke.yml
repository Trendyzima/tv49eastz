name: Android Build Certification

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-build-certification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  MEDIA3_PATCHED_REPO: https://github.com/anonfaded/media3-patched.git
  MEDIA3_PATCHED_SHA: 6d498560637d273dcb754727c9dcdce97548e621
  MEDIA3_PATCHED_PATH: /tmp/media3-patched
  CI_KEYSTORE_PATH: /tmp/tv49eastz-ci-release.jks
  CI_KEYSTORE_PASSWORD: changeit-ci-only
  CI_KEY_ALIAS: tv49eastz-ci
  CI_KEY_PASSWORD: changeit-ci-only
  TV_EAST_CATALOG_URL: ${{ vars.TV_EAST_CATALOG_URL }}

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch pinned patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$MEDIA3_PATCHED_PATH"
          git init "$MEDIA3_PATCHED_PATH"
          git -C "$MEDIA3_PATCHED_PATH" remote add origin "$MEDIA3_PATCHED_REPO"
          git -C "$MEDIA3_PATCHED_PATH" fetch --depth 1 origin "$MEDIA3_PATCHED_SHA"
          git -C "$MEDIA3_PATCHED_PATH" checkout --detach FETCH_HEAD
          actual_sha="$(git -C "$MEDIA3_PATCHED_PATH" rev-parse HEAD)"
          test "$actual_sha" = "$MEDIA3_PATCHED_SHA"
          test -f "$MEDIA3_PATCHED_PATH/libraries/muxer/src/main/java/androidx/media3/muxer/ProcessedSegment.java"
          test -d "$MEDIA3_PATCHED_PATH/libraries/common"
          test -d "$MEDIA3_PATCHED_PATH/libraries/container"
          test -d "$MEDIA3_PATCHED_PATH/libraries/muxer"

      - name: Normalize pinned Media3 manifests
        shell: bash
        run: |
          set -euo pipefail
          for module in common container muxer; do
            manifest="$MEDIA3_PATCHED_PATH/libraries/$module/src/main/AndroidManifest.xml"
            test -f "$manifest"
            sed -i -E 's/[[:space:]]+package="androidx\.media3\.[^"]+"//' "$manifest"
            ! grep -Eq '^[[:space:]]*<manifest[^>]*package=' "$manifest"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Prepare CI release signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$CI_KEYSTORE_PATH"
          keytool -genkeypair -noprompt -keystore "$CI_KEYSTORE_PATH" -storepass "$CI_KEYSTORE_PASSWORD" -keypass "$CI_KEY_PASSWORD" -alias "$CI_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname "CN=tv49eastz CI,O=tv49eastz,C=XX"
          chmod 600 "$CI_KEYSTORE_PATH"
          printf '%s\n' "KEYSTORE_FILE=$CI_KEYSTORE_PATH" "KEYSTORE_PASSWORD=$CI_KEYSTORE_PASSWORD" "KEY_ALIAS=$CI_KEY_ALIAS" "KEY_PASSWORD=$CI_KEY_PASSWORD" > local.properties
          chmod 600 local.properties
          keytool -list -v -keystore "$CI_KEYSTORE_PATH" -storepass "$CI_KEYSTORE_PASSWORD" -alias "$CI_KEY_ALIAS" | grep -E 'Owner:|SHA256:' | tee signing-certificate.txt

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Discover required Android tasks
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-watch-fs :app:tasks --all > /tmp/app-tasks.txt
          ./gradlew --no-daemon --no-watch-fs :tv-receiver:tasks --all > /tmp/tv-tasks.txt
          for task in testDefaultDebugUnitTest assembleDefaultDebug assembleDefaultRelease; do grep -Fq "$task" /tmp/app-tasks.txt || exit 1; done
          for task in testDebugUnitTest assembleDebug assembleRelease; do grep -Fq "$task" /tmp/tv-tasks.txt || exit 1; done

      - name: Verify patched Media3 substitution
        shell: bash
        run: |
          set -euo pipefail
          verify_substitution() {
            local module="$1" project="$2" output="/tmp/${1//:/-}-dependency.txt"
            ./gradlew --no-daemon --no-watch-fs --stacktrace :app:dependencyInsight --dependency "$module" --configuration defaultDebugCompileClasspath >"$output" 2>&1 || { cat "$output"; exit 1; }
            grep -Fq "project $project" "$output" || { cat "$output"; exit 1; }
          }
          verify_substitution "androidx.media3:media3-muxer" ":media3-patched:lib-muxer"
          verify_substitution "androidx.media3:media3-common" ":media3-patched:lib-common"
          verify_substitution "androidx.media3:media3-container" ":media3-patched:lib-container"

      - name: Run Android unit tests
        run: ./gradlew --no-daemon --no-watch-fs --stacktrace testDefaultDebugUnitTest :tv-receiver:test

      - name: Assemble paired release APKs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${TV_EAST_CATALOG_URL:-}" ]]; then
            ./gradlew :app:assembleDefaultRelease :tv-receiver:assembleRelease -PtvEastCatalogUrl="$TV_EAST_CATALOG_URL" --no-daemon --no-watch-fs --stacktrace
          else
            ./gradlew :app:assembleDefaultRelease :tv-receiver:assembleRelease --no-daemon --no-watch-fs --stacktrace
          fi

      - name: Resolve Android SDK build-tools
        id: android-tools
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk" && test -d "$sdk"
          mapfile -t zipalign_candidates < <(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -type f -name zipalign -perm -111 -print 2>/dev/null | sort -V -r)
          zipalign="${zipalign_candidates[0]:-}"
          test -x "$zipalign"
          echo "zipalign=$zipalign" >> "$GITHUB_OUTPUT"

      - name: Verify, identify and pair APKs
        shell: bash
        env:
          ZIPALIGN: ${{ steps.android-tools.outputs.zipalign }}
        run: |
          set -euo pipefail
          test -x "$ZIPALIGN"
          fadcam_apk="$(find app/build/outputs/apk -type f -path '*/default/release/*.apk' -print -quit)"
          tv_apk="$(find tv-receiver/build/outputs/apk -type f -path '*/release/*.apk' -print -quit)"
          test -s "$fadcam_apk"
          test -s "$tv_apk"
          "$ZIPALIGN" -c -P 16 -v 4 "$fadcam_apk"
          "$ZIPALIGN" -c -P 16 -v 4 "$tv_apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          build_tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V -r | head -n1)"
          aapt="$build_tools/aapt"
          apksigner="$build_tools/apksigner"
          test -x "$aapt" && test -x "$apksigner"
          "$aapt" dump badging "$fadcam_apk" | grep -F "package: name='com.fadcam'"
          "$aapt" dump badging "$tv_apk" | grep -F "package: name='com.tv49.com'"
          fadcam_cert="$($apksigner verify --print-certs "$fadcam_apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)"
          tv_cert="$($apksigner verify --print-certs "$tv_apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)"
          test -n "$fadcam_cert" && test -n "$tv_cert"
          test "$fadcam_cert" = "$tv_cert"
          mkdir -p dist
          cp "$fadcam_apk" dist/FadCam.apk
          cp "$tv_apk" dist/TV49East.apk
          {
            echo "FadCam APK: com.fadcam"
            echo "TV 49 East APK: com.tv49.com"
            echo "Shared release signing certificate SHA-256: $fadcam_cert"
            echo "FadCam source: $fadcam_apk"
            echo "TV source: $tv_apk"
            echo "Commit: $GITHUB_SHA"
          } | tee dist/PAIR-MANIFEST.txt
          cat dist/PAIR-MANIFEST.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exactly two downloadable APKs
        uses: actions/upload-artifact@v4
        with:
          name: tv49east-apk-pair-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/FadCam.apk
            dist/TV49East.apk
            dist/PAIR-MANIFEST.txt
            signing-certificate.txt

      - name: Publish latest verified CI APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            dist/FadCam.apk
            dist/TV49East.apk
            dist/PAIR-MANIFEST.txt
            signing-certificate.txt
          )
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "${assets[@]}" --clobber
            gh release edit latest \
              --title "TV 49 East — Latest Verified CI Build" \
              --notes "Verified Android APK pair from commit $GITHUB_SHA. Both APKs passed unit tests, APK alignment, package-ID checks, and shared-signing-certificate verification. These are CI-signed testing builds, not production-signed releases."
          else
            gh release create latest "${assets[@]}" \
              --title "TV 49 East — Latest Verified CI Build" \
              --notes "Verified Android APK pair from commit $GITHUB_SHA. Both APKs passed unit tests, APK alignment, package-ID checks, and shared-signing-certificate verification. These are CI-signed testing builds, not production-signed releases."
          fi
