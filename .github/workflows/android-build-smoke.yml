name: Android Build Smoke Test

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-build-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Immutable Media3 build input. Do not replace this with a branch/tag.
  MEDIA3_PATCHED_REPO: https://github.com/anonfaded/media3-patched.git
  MEDIA3_PATCHED_SHA: 6d498560637d273dcb754727c9dcdce97548e621
  MEDIA3_PATCHED_PATH: /tmp/media3-patched

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Fetch pinned patched Media3
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${MEDIA3_PATCHED_PATH}"
          git init "${MEDIA3_PATCHED_PATH}"
          git -C "${MEDIA3_PATCHED_PATH}" remote add origin "${MEDIA3_PATCHED_REPO}"
          git -C "${MEDIA3_PATCHED_PATH}" fetch --depth 1 origin "${MEDIA3_PATCHED_SHA}"
          git -C "${MEDIA3_PATCHED_PATH}" checkout --detach FETCH_HEAD

          actual_sha="$(git -C "${MEDIA3_PATCHED_PATH}" rev-parse HEAD)"
          test "${actual_sha}" = "${MEDIA3_PATCHED_SHA}"
          echo "Pinned Media3 commit: ${actual_sha}"

      - name: Verify patched Media3 build input
        shell: bash
        run: |
          set -euo pipefail

          test -d "${MEDIA3_PATCHED_PATH}"
          test -f "${MEDIA3_PATCHED_PATH}/libraries/muxer/src/main/java/androidx/media3/muxer/ProcessedSegment.java"
          test -d "${MEDIA3_PATCHED_PATH}/libraries/common"
          test -d "${MEDIA3_PATCHED_PATH}/libraries/container"
          test -d "${MEDIA3_PATCHED_PATH}/libraries/muxer"

          grep -q 'include modulePrefix + '\''lib-common'\''' "${MEDIA3_PATCHED_PATH}/core_settings.gradle"
          grep -q 'include modulePrefix + '\''lib-container'\''' "${MEDIA3_PATCHED_PATH}/core_settings.gradle"
          grep -q 'include modulePrefix + '\''lib-muxer'\''' "${MEDIA3_PATCHED_PATH}/core_settings.gradle"

          echo 'Patched Media3 invariant satisfied.'
          echo 'ProcessedSegment.java present.'
          echo 'common/container/muxer modules present.'

      - name: Set up Java 17
        # actions/setup-java v5.6.0
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Validate Gradle wrapper
        run: |
          set -euo pipefail
          test -x ./gradlew || chmod +x ./gradlew
          ./gradlew --version

      - name: Verify Gradle composite substitutions
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon --stacktrace \
            :app:dependencyInsight \
            --dependency media3-muxer \
            --configuration defaultDebugCompileClasspath | tee /tmp/media3-muxer-dependency.txt
          grep -Eq 'project :lib-muxer|androidx\.media3:media3-muxer.*project :lib-muxer' /tmp/media3-muxer-dependency.txt

          ./gradlew --no-daemon --stacktrace \
            :app:dependencyInsight \
            --dependency media3-common \
            --configuration defaultDebugCompileClasspath | tee /tmp/media3-common-dependency.txt
          grep -Eq 'project :lib-common|androidx\.media3:media3-common.*project :lib-common' /tmp/media3-common-dependency.txt

          ./gradlew --no-daemon --stacktrace \
            :app:dependencyInsight \
            --dependency media3-container \
            --configuration defaultDebugCompileClasspath | tee /tmp/media3-container-dependency.txt
          grep -Eq 'project :lib-container|androidx\.media3:media3-container.*project :lib-container' /tmp/media3-container-dependency.txt

          echo 'Gradle composite substitutions verified.'

      - name: Run default debug unit tests
        run: ./gradlew --no-daemon --stacktrace testDefaultDebugUnitTest

      - name: Assemble default debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDefaultDebug
