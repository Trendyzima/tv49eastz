name: Android Build Smoke Test

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-build-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone patched Media3
        run: git clone --depth 1 https://github.com/anonfaded/media3-patched.git /tmp/media3-patched

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Validate Gradle wrapper
        run: |
          set -euo pipefail
          test -x ./gradlew || chmod +x ./gradlew
          ./gradlew --version

      - name: Run default debug unit tests
        run: ./gradlew --no-daemon --stacktrace testDefaultDebugUnitTest

      - name: Assemble default debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDefaultDebug
