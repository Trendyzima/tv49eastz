name: Build FadCam Pro Variants (Pre-built)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fadcam-pro-build
  cancel-in-progress: true

env:
  MEDIA3_PATCHED_REPO: https://github.com/anonfaded/media3-patched.git
  MEDIA3_PATCHED_SHA: 6d498560637d273dcb754727c9dcdce97548e621
  MEDIA3_PATCHED_PATH: /tmp/media3-patched

jobs:
  build-pro-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Normalize Fastlane Supply graphics
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          image_dir="fastlane/metadata/android/en-US/images"
          test -f "$image_dir/featureGraphic.jpg"
          test -f "$image_dir/promoGraphic.jpg"
          test -f "$image_dir/tvBanner.jpg"
          command -v convert
          command -v identify
          convert "$image_dir/featureGraphic.jpg" -background white -alpha remove -alpha off -colorspace sRGB -strip -resize 1024x500! -sampling-factor 4:2:0 -quality 92 "$image_dir/featureGraphic.jpg"
          convert "$image_dir/promoGraphic.jpg" -background white -alpha remove -alpha off -colorspace sRGB -strip -resize 180x120! -sampling-factor 4:2:0 -quality 92 "$image_dir/promoGraphic.jpg"
          convert "$image_dir/tvBanner.jpg" -background white -alpha remove -alpha off -colorspace sRGB -strip -resize 1280x720! -sampling-factor 4:2:0 -quality 92 "$image_dir/tvBanner.jpg"
          identify -format '%f %wx%h %[channels]\n' "$image_dir/featureGraphic.jpg" "$image_dir/promoGraphic.jpg" "$image_dir/tvBanner.jpg"

      - name: Validate Fastlane Supply Metadata
        uses: ashutoshgngwr/validate-fastlane-supply-metadata@v2.1.0
        with:
          fastlane-path: ./fastlane/metadata/android
          use-play-store-locales: false

      - name: Fetch pinned patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$MEDIA3_PATCHED_PATH"
          git init "$MEDIA3_PATCHED_PATH"
          git -C "$MEDIA3_PATCHED_PATH" remote add origin "$MEDIA3_PATCHED_REPO"
          git -C "$MEDIA3_PATCHED_PATH" fetch --depth 1 origin "$MEDIA3_PATCHED_SHA"
          git -C "$MEDIA3_PATCHED_PATH" checkout --detach FETCH_HEAD
          actual_sha="$(git -C "$MEDIA3_PATCHED_PATH" rev-parse HEAD)"
          test "$actual_sha" = "$MEDIA3_PATCHED_SHA"
          test -f "$MEDIA3_PATCHED_PATH/libraries/muxer/src/main/java/androidx/media3/muxer/ProcessedSegment.java"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Setup local.properties with release keystore
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD secret is required}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is required}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is required}"
          printf '%s\n' "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" "KEY_ALIAS=$KEY_ALIAS" "KEY_PASSWORD=$KEY_PASSWORD" > local.properties
          chmod 600 local.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Decode and validate keystore
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 secret is required}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo 'Release keystore validated.'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Build Notes Pro variant
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-watch-fs --stacktrace assembleNotesProRelease

      - name: Build Calculator Pro variant
        shell: bash
        run: ./gradlew --no-daemon --no-watch-fs --stacktrace assembleCalcProRelease

      - name: Build Weather Pro variant
        shell: bash
        run: ./gradlew --no-daemon --no-watch-fs --stacktrace assembleWeatherProRelease

      - name: Verify APKs were built
        shell: bash
        run: |
          set -euo pipefail
          for flavor in notesPro calcPro weatherPro; do
            dir="app/build/outputs/apk/$flavor/release"
            shopt -s nullglob
            matches=("$dir"/FadCam_${flavor}_v*-arm64-v8a.apk)
            if [ ${#matches[@]} -ne 1 ] || [ ! -s "${matches[0]}" ]; then
              echo "Expected exactly one non-empty $flavor APK in $dir"
              find "$dir" -maxdepth 1 -type f -print 2>/dev/null || true
              exit 1
            fi
            echo "✓ ${matches[0]}"
          done

      - name: Upload Pro variant artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fadcam-pro-variants
          path: app/build/outputs/apk/*/release/FadCam_*_arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        shell: bash
        run: |
          echo '## FadCam Pro variants' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build completed and APK paths verified.' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
