name: End-to-end streaming contract

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'tv-receiver/**'
      - 'server-tap/**'
      - 'device-tunnel/**'
      - 'stream-catalog/**'
      - 'stream-gateway/**'
      - 'origin-shield/**'
      - 'cloudflare-relay/**'
      - 'deploy/edge/**'
      - '.github/workflows/e2e-contract.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tv-receiver/**'
      - 'server-tap/**'
      - 'device-tunnel/**'
      - 'stream-catalog/**'
      - 'stream-gateway/**'
      - 'origin-shield/**'
      - 'cloudflare-relay/**'
      - 'deploy/edge/**'
      - '.github/workflows/e2e-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MEDIA3_PATCHED_REPO: https://github.com/anonfaded/media3-patched.git
  MEDIA3_PATCHED_SHA: 6d498560637d273dcb754727c9dcdce97548e621
  MEDIA3_PATCHED_PATH: /tmp/media3-patched

jobs:
  go-contracts:
    name: Go ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - server-tap
          - device-tunnel
          - stream-catalog
          - stream-gateway
          - origin-shield
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: ${{ matrix.component }}/go.mod
      - name: Format check for changed Go files
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha || github.event.before }}" "$GITHUB_SHA" -- '*.go' | grep -E '^${{ matrix.component }}/' || true)"
          if [ -z "$files" ]; then
            echo "No Go files changed for ${{ matrix.component }}; existing legacy formatting is not part of this PR."
            exit 0
          fi
          echo "$files"
          test -z "$(printf '%s\n' "$files" | xargs gofmt -l)"
      - name: Tests
        run: go test ./... -count=1 -race
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath ./...

  cloudflare-relay:
    name: Cloudflare relay typecheck and contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-relay
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare-relay/package.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Verify relay contract surface
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'RELAY_TUNNEL' src/entry.ts
          grep -q 'SESSION_STORE' src/entry.ts
          grep -q '/v1/device/session' src/entry.ts
          grep -q '/stream/' src/entry.ts
          grep -q 'rewritePlaylist' src/entry.ts
          grep -q '/tunnel' src/index.ts
          grep -q 'request-coalescing' src/index.ts
          echo 'Cloudflare relay contract is structurally present.'

  android-receiver:
    name: TV 49 East receiver build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Fetch pinned patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$MEDIA3_PATCHED_PATH"
          git init "$MEDIA3_PATCHED_PATH"
          git -C "$MEDIA3_PATCHED_PATH" remote add origin "$MEDIA3_PATCHED_REPO"
          git -C "$MEDIA3_PATCHED_PATH" fetch --depth 1 origin "$MEDIA3_PATCHED_SHA"
          git -C "$MEDIA3_PATCHED_PATH" checkout --detach FETCH_HEAD
          test "$(git -C "$MEDIA3_PATCHED_PATH" rev-parse HEAD)" = "$MEDIA3_PATCHED_SHA"
          test -d "$MEDIA3_PATCHED_PATH/libraries/common"
          test -d "$MEDIA3_PATCHED_PATH/libraries/container"
          test -d "$MEDIA3_PATCHED_PATH/libraries/muxer"
          printf '%s\n' "media3.patched.path=$MEDIA3_PATCHED_PATH" > local.properties
          chmod 600 local.properties
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Assemble receiver
        run: ./gradlew :tv-receiver:assembleDebug --no-daemon --no-watch-fs --stacktrace

  wiring-contract:
    name: Verify deployment wiring contract
    runs-on: ubuntu-latest
    needs: [go-contracts, cloudflare-relay, android-receiver]
    steps:
      - uses: actions/checkout@v4
      - name: Check required integration boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f server-tap/go.mod
          test -f device-tunnel/go.mod
          test -f stream-catalog/go.mod
          test -f stream-gateway/go.mod
          test -f origin-shield/go.mod
          test -f tv-receiver/build.gradle.kts
          test -f cloudflare-relay/package.json
          test -f cloudflare-relay/src/entry.ts
          grep -q 'TUNNEL_PROXY_BASE_URL' deploy/edge/.env.example
          grep -q 'CREATOR_REGISTRY_FILE' deploy/edge/.env.example
          grep -q 'RELAY_SIGNING_SECRET' deploy/edge/.env.example
          grep -q 'TV_EAST_CATALOG_URL' deploy/edge/.env.example
          grep -q '/v1/catalog' deploy/edge/README.md
          grep -q '/v1/relay?id=' deploy/edge/README.md
          grep -q '/live.m3u8' deploy/edge/README.md
          echo 'E2E wiring contract is structurally present.'
