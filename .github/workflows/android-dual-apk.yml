name: Android Dual APK Certification

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-dual-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDIA3_PATCHED_REPO: https://github.com/anonfaded/media3-patched.git
  MEDIA3_PATCHED_SHA: 6d498560637d273dcb754727c9dcdce97548e621
  MEDIA3_PATCHED_PATH: /tmp/media3-patched

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch pinned patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${MEDIA3_PATCHED_PATH}"
          git init "${MEDIA3_PATCHED_PATH}"
          git -C "${MEDIA3_PATCHED_PATH}" remote add origin "${MEDIA3_PATCHED_REPO}"
          git -C "${MEDIA3_PATCHED_PATH}" fetch --depth 1 origin "${MEDIA3_PATCHED_SHA}"
          git -C "${MEDIA3_PATCHED_PATH}" checkout --detach FETCH_HEAD
          actual_sha="$(git -C "${MEDIA3_PATCHED_PATH}" rev-parse HEAD)"
          test "${actual_sha}" = "${MEDIA3_PATCHED_SHA}"
          test -f "${MEDIA3_PATCHED_PATH}/libraries/muxer/src/main/java/androidx/media3/muxer/ProcessedSegment.java"
          test -d "${MEDIA3_PATCHED_PATH}/libraries/common"
          test -d "${MEDIA3_PATCHED_PATH}/libraries/container"
          test -d "${MEDIA3_PATCHED_PATH}/libraries/muxer"
          echo "Pinned Media3 commit: ${actual_sha}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify Android task graph
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-watch-fs :app:tasks --all > /tmp/app-tasks.txt
          ./gradlew --no-daemon --no-watch-fs :tv-receiver:tasks --all > /tmp/tv-tasks.txt
          for task in testDefaultDebugUnitTest assembleDefaultDebug assembleDefaultRelease; do
            grep -Fq "$task" /tmp/app-tasks.txt || { echo "Missing app task: $task"; exit 1; }
          done
          for task in testDebugUnitTest assembleDebug assembleRelease; do
            grep -Fq "$task" /tmp/tv-tasks.txt || { echo "Missing TV task: $task"; exit 1; }
          done

      - name: Verify patched Media3 substitutions
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local module="$1"
            local project="$2"
            local out="/tmp/dependency-${module//:/-}.txt"
            echo "=== dependencyInsight: ${module} ==="
            if ! ./gradlew --no-daemon --no-watch-fs --stacktrace \
              :app:dependencyInsight \
              --dependency "$module" \
              --configuration defaultDebugCompileClasspath >"$out" 2>&1; then
              cat "$out"
              echo "FAIL: dependencyInsight failed for ${module}"
              exit 1
            fi
            cat "$out"
            # Composite-build substitutions are reported with the composite
            # build's project path (for example :media3-patched:lib-muxer),
            # not merely the nested project name (:lib-muxer).
            grep -Fqx "${project}" <(grep -E '^project :media3-patched:lib-' "$out") || {
              echo "FAIL: ${module} is not resolved to expected composite project ${project}"
              echo "--- resolved composite projects ---"
              grep -E '^project :media3-patched:lib-' "$out" || true
              exit 1
            }
            echo "PASS: ${module} -> ${project}"
          }
          verify "androidx.media3:media3-muxer" ":media3-patched:lib-muxer"
          verify "androidx.media3:media3-common" ":media3-patched:lib-common"
          verify "androidx.media3:media3-container" ":media3-patched:lib-container"

      - name: Android unit tests
        run: ./gradlew :app:test :tv-receiver:test --no-daemon --stacktrace

      - name: Build FadCam APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Build TV receiver APKs
        run: ./gradlew :tv-receiver:assembleDebug :tv-receiver:assembleRelease --no-daemon --stacktrace

      - name: Verify APK outputs and alignment
        shell: bash
        run: |
          set -euo pipefail
          apk_count=0
          for root in app/build/outputs/apk tv-receiver/build/outputs/apk; do
            while IFS= read -r -d '' apk; do
              test -s "$apk"
              echo "APK: $apk"
              zipalign -c -P 16 -v 4 "$apk"
              apk_count=$((apk_count + 1))
            done < <(find "$root" -type f -name '*.apk' -print0)
          done
          test "$apk_count" -ge 4 || {
            echo "Expected at least 4 APKs, found $apk_count"
            find app/build/outputs/apk tv-receiver/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          }
          echo "Certified APK count: $apk_count"

      - name: Upload coordinated APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-dual-apk-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/**/*.apk
            tv-receiver/build/outputs/apk/**/*.apk
          retention-days: 7
