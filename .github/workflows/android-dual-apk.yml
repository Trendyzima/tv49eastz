name: Android Dual APK Certification

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-dual-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDIA3_PATCHED_REPO: https://github.com/anonfaded/media3-patched.git
  MEDIA3_PATCHED_SHA: 6d498560637d273dcb754727c9dcdce97548e621
  MEDIA3_PATCHED_PATH: /tmp/media3-patched
  CI_KEYSTORE_PATH: /tmp/tv49eastz-ci-release.jks
  CI_KEYSTORE_PASSWORD: changeit-ci-only
  CI_KEY_ALIAS: tv49eastz-ci
  CI_KEY_PASSWORD: changeit-ci-only

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch pinned patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$MEDIA3_PATCHED_PATH"
          git init "$MEDIA3_PATCHED_PATH"
          git -C "$MEDIA3_PATCHED_PATH" remote add origin "$MEDIA3_PATCHED_REPO"
          git -C "$MEDIA3_PATCHED_PATH" fetch --depth 1 origin "$MEDIA3_PATCHED_SHA"
          git -C "$MEDIA3_PATCHED_PATH" checkout --detach FETCH_HEAD
          actual_sha="$(git -C "$MEDIA3_PATCHED_PATH" rev-parse HEAD)"
          test "$actual_sha" = "$MEDIA3_PATCHED_SHA"
          test -f "$MEDIA3_PATCHED_PATH/libraries/muxer/src/main/java/androidx/media3/muxer/ProcessedSegment.java"
          test -d "$MEDIA3_PATCHED_PATH/libraries/common"
          test -d "$MEDIA3_PATCHED_PATH/libraries/container"
          test -d "$MEDIA3_PATCHED_PATH/libraries/muxer"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare CI release signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$CI_KEYSTORE_PATH"
          keytool -genkeypair -noprompt -keystore "$CI_KEYSTORE_PATH" -storepass "$CI_KEYSTORE_PASSWORD" -keypass "$CI_KEY_PASSWORD" -alias "$CI_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname "CN=tv49eastz CI,O=tv49eastz,C=XX"
          chmod 600 "$CI_KEYSTORE_PATH"
          printf '%s\n' "KEYSTORE_FILE=$CI_KEYSTORE_PATH" "KEYSTORE_PASSWORD=$CI_KEYSTORE_PASSWORD" "KEY_ALIAS=$CI_KEY_ALIAS" "KEY_PASSWORD=$CI_KEY_PASSWORD" > local.properties
          chmod 600 local.properties

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Verify Android task graph
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-watch-fs :app:tasks --all > /tmp/app-tasks.txt
          ./gradlew --no-daemon --no-watch-fs :tv-receiver:tasks --all > /tmp/tv-tasks.txt
          for task in testDefaultDebugUnitTest assembleDefaultDebug assembleDefaultRelease assembleProPlus; do
            grep -Fq "$task" /tmp/app-tasks.txt || { echo "Missing app task: $task"; exit 1; }
          done
          for task in testDebugUnitTest assembleDebug assembleRelease; do
            grep -Fq "$task" /tmp/tv-tasks.txt || { echo "Missing TV task: $task"; exit 1; }
          done

      - name: Verify patched Media3 substitutions
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local module="$1" project="$2" out="/tmp/dependency-${1//:/-}.txt"
            ./gradlew --no-daemon --no-watch-fs --stacktrace :app:dependencyInsight --dependency "$module" --configuration defaultDebugCompileClasspath >"$out" 2>&1 || { cat "$out"; exit 1; }
            grep -Fq "project $project" "$out" || { cat "$out"; echo "FAIL: $module -> $project"; exit 1; }
          }
          verify "androidx.media3:media3-muxer" ":media3-patched:lib-muxer"
          verify "androidx.media3:media3-common" ":media3-patched:lib-common"
          verify "androidx.media3:media3-container" ":media3-patched:lib-container"

      - name: Android unit tests
        shell: bash
        run: ./gradlew :app:test :tv-receiver:test --no-daemon --no-watch-fs --stacktrace

      - name: Build FadCam APKs
        shell: bash
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleProPlus --no-daemon --no-watch-fs --stacktrace

      - name: Build TV receiver APKs
        shell: bash
        run: ./gradlew :tv-receiver:assembleDebug :tv-receiver:assembleRelease --no-daemon --no-watch-fs --stacktrace

      - name: Resolve Android SDK build-tools
        id: android-tools
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk" && test -d "$sdk" || { echo "ERROR: Android SDK root is unavailable"; exit 1; }
          build_tools="$sdk/build-tools"
          test -d "$build_tools" || { echo "ERROR: Android SDK build-tools directory is unavailable: $build_tools"; exit 1; }

          # Bash process-substitution loops run in a subshell. Use mapfile so the
          # discovered path remains available to the parent shell.
          mapfile -t zipalign_candidates < <(
            find "$build_tools" -mindepth 2 -maxdepth 2 -type f -name zipalign -perm -111 -print 2>/dev/null \
              | sort -t/ -k1,1 -k2,2V -r
          )

          zipalign=""
          for candidate in "${zipalign_candidates[@]}"; do
            if [[ -x "$candidate" ]]; then
              zipalign="$candidate"
              break
            fi
          done

          if [[ -z "$zipalign" ]]; then
            echo "ERROR: no executable zipalign found under $build_tools"
            find "$build_tools" -type f -name zipalign -print 2>/dev/null || true
            ls -la "$build_tools" 2>/dev/null || true
            exit 1
          fi

          echo "Using zipalign: $zipalign"
          "$zipalign" version
          echo "zipalign=$zipalign" >> "$GITHUB_OUTPUT"

      - name: Verify APK outputs and alignment
        shell: bash
        env:
          ZIPALIGN: ${{ steps.android-tools.outputs.zipalign }}
        run: |
          set -euo pipefail
          test -n "$ZIPALIGN"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" version
          apk_count=0
          for root in app/build/outputs/apk tv-receiver/build/outputs/apk; do
            [[ -d "$root" ]] || continue
            while IFS= read -r -d '' apk; do
              test -s "$apk"
              echo "APK: $apk"
              "$ZIPALIGN" -c -P 16 -v 4 "$apk"
              apk_count=$((apk_count + 1))
            done < <(find "$root" -type f -name '*.apk' -print0)
          done
          test "$apk_count" -ge 6 || { echo "Expected at least 6 APKs, found $apk_count"; find app/build/outputs/apk tv-receiver/build/outputs/apk -type f -name '*.apk' -print || true; exit 1; }
          echo "Certified APK count: $apk_count"

      - name: Upload coordinated APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-dual-apk-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/**/*.apk
            tv-receiver/build/outputs/apk/**/*.apk
          retention-days: 7
