name: Android APK Builds

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# PR builds may be superseded safely. Master builds must finish so a good APK
# build cannot be killed merely because another commit arrived on master.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MEDIA3_PATCHED_REPO: https://github.com/anonfaded/media3-patched.git
  MEDIA3_PATCHED_SHA: 6d498560637d273dcb754727c9dcdce97548e621
  MEDIA3_PATCHED_PATH: /tmp/media3-patched
  CI_KEYSTORE_PATH: /tmp/tv49eastz-ci-release.jks
  CI_KEYSTORE_PASSWORD: changeit-ci-only
  CI_KEY_ALIAS: tv49eastz-ci
  CI_KEY_PASSWORD: changeit-ci-only

jobs:
  build:
    name: Build FadCam + TV 49 East APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch pinned patched Media3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$MEDIA3_PATCHED_PATH"
          git init "$MEDIA3_PATCHED_PATH"
          git -C "$MEDIA3_PATCHED_PATH" remote add origin "$MEDIA3_PATCHED_REPO"
          git -C "$MEDIA3_PATCHED_PATH" fetch --depth 1 origin "$MEDIA3_PATCHED_SHA"
          git -C "$MEDIA3_PATCHED_PATH" checkout --detach FETCH_HEAD
          test "$(git -C "$MEDIA3_PATCHED_PATH" rev-parse HEAD)" = "$MEDIA3_PATCHED_SHA"
          test -f "$MEDIA3_PATCHED_PATH/libraries/muxer/src/main/java/androidx/media3/muxer/ProcessedSegment.java"
          test -d "$MEDIA3_PATCHED_PATH/libraries/common"
          test -d "$MEDIA3_PATCHED_PATH/libraries/container"
          test -d "$MEDIA3_PATCHED_PATH/libraries/muxer"
          printf '%s\n' "media3.patched.path=$MEDIA3_PATCHED_PATH" > local.properties
          chmod 600 local.properties

      - name: Normalize pinned Media3 manifests
        shell: bash
        run: |
          set -euo pipefail
          for module in common container muxer; do
            manifest="$MEDIA3_PATCHED_PATH/libraries/$module/src/main/AndroidManifest.xml"
            test -f "$manifest"
            sed -i -E 's/[[:space:]]+package="androidx\.media3\.[^"]+"//' "$manifest"
            ! grep -Eq '^[[:space:]]*<manifest[^>]*package=' "$manifest"
          done

      - name: Validate Android string resources
        shell: python
        run: |
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          roots = [pathlib.Path("app/src"), pathlib.Path("tv-receiver/src")]
          bad = []
          valid_escapes = re.compile(r"\\(?:n|t|r|\\|'|\"|@|\?|#|u[0-9A-Fa-f]{4})")
          slash = re.compile(r"\\")

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("res/values/*.xml"):
                  try:
                      ET.parse(path)
                  except ET.ParseError as exc:
                      bad.append(f"{path}: XML parse error: {exc}")
                      continue
                  text = path.read_text(encoding="utf-8")
                  for match in slash.finditer(text):
                      prefix = text[max(0, match.start() - 40):match.start() + 12]
                      if not valid_escapes.match(text, match.start()):
                          bad.append(f"{path}: unsupported Android string escape near {prefix!r}")

          if bad:
              print("Invalid Android resources detected:")
              print("\n".join(bad))
              raise SystemExit(1)
          print("Android XML/string-resource preflight passed.")

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Prepare CI signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$CI_KEYSTORE_PATH"
          keytool -genkeypair -noprompt \
            -keystore "$CI_KEYSTORE_PATH" \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=tv49eastz CI,O=tv49eastz,C=XX"
          chmod 600 "$CI_KEYSTORE_PATH"
          printf '%s\n' \
            "KEYSTORE_FILE=$CI_KEYSTORE_PATH" \
            "KEYSTORE_PASSWORD=$CI_KEYSTORE_PASSWORD" \
            "KEY_ALIAS=$CI_KEY_ALIAS" \
            "KEY_PASSWORD=$CI_KEY_PASSWORD" \
            "media3.patched.path=$MEDIA3_PATCHED_PATH" > local.properties
          chmod 600 local.properties

      - name: Verify patched Media3 substitution
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            "androidx.media3:media3-muxer :media3-patched:lib-muxer" \
            "androidx.media3:media3-common :media3-patched:lib-common" \
            "androidx.media3:media3-container :media3-patched:lib-container"; do
            set -- $spec
            ./gradlew --no-daemon --no-watch-fs --stacktrace \
              :app:dependencyInsight --dependency "$1" \
              --configuration defaultDebugCompileClasspath | grep -Fq "project $2"
          done

      - name: Run Android tests
        run: ./gradlew clean :app:test :tv-receiver:test --no-daemon --no-watch-fs --stacktrace

      # Do not package both Android applications in one Gradle invocation.
      # The FadCam APK contains a large native dependency set and its release
      # R8/ZipFlinger path is memory-heavy. Separate invocations give each
      # application a clean Gradle JVM and prevent cross-module packaging
      # pressure from turning into heap exhaustion or orphaned JVMs.
      - name: Build FadCam APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :app:assembleDefaultDebug \
            :app:assembleDefaultRelease \
            --no-daemon --no-watch-fs --stacktrace --max-workers=1

      - name: Build TV 49 East APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :tv-receiver:assembleDebug \
            :tv-receiver:assembleRelease \
            --no-daemon --no-watch-fs --stacktrace --max-workers=1

      - name: Collect APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          fadcam_debug="$(find app/build/outputs/apk -type f -path '*/default/debug/*.apk' -print -quit)"
          fadcam_release="$(find app/build/outputs/apk -type f -path '*/default/release/*.apk' -print -quit)"
          tv_debug="$(find tv-receiver/build/outputs/apk -type f -path '*/debug/*.apk' -print -quit)"
          tv_release="$(find tv-receiver/build/outputs/apk -type f -path '*/release/*.apk' -print -quit)"
          test -s "$fadcam_debug"
          test -s "$fadcam_release"
          test -s "$tv_debug"
          test -s "$tv_release"
          cp "$fadcam_debug" dist/FadCam-debug.apk
          cp "$fadcam_release" dist/FadCam-release-ci.apk
          cp "$fadcam_release" dist/FadCam.apk
          cp "$tv_debug" dist/TV49East-debug.apk
          cp "$tv_release" dist/TV49East-release-ci.apk
          cp "$tv_release" dist/TV49East.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          printf '%s\n' \
            "Build commit: $GITHUB_SHA" \
            "Media3 patch: $MEDIA3_PATCHED_SHA" \
            "CI APKs use an ephemeral CI signing key and are for testing." \
            "Production releases are published separately by production-release.yml." \
            > dist/BUILD-INFO.txt

      - name: Upload downloadable APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tv49east-android-apks-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/FadCam-debug.apk
            dist/FadCam-release-ci.apk
            dist/TV49East-debug.apk
            dist/TV49East-release-ci.apk
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt

      - name: Publish latest verified APK release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Verified CI APKs
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            Automated verified CI APKs from `${{ github.sha }}`.

            These APKs are for testing. They are not production-signed releases.
          files: |
            dist/FadCam.apk
            dist/TV49East.apk
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
