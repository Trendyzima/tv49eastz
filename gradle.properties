# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE will override settings specified here.
#
# CI builds package multiple Android applications and can require substantially
# more heap than the historical 2 GiB setting. Keep the heap bounded below the
# GitHub-hosted runner memory limit while leaving enough headroom for AGP,
# resource processing, and APK packaging (ZipFlinger).
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false

# AndroidX package structure
android.useAndroidX=true

# Reduces generated R-class size by avoiding transitive resource exposure.
android.nonTransitiveRClass=true
android.javaCompile.suppressSourceTargetDeprecationWarning=true
org.gradle.configuration-cache=true
