[cerebrium.deployment]
name = "tv49-social-ai"
python_version = "3.12"
include = ["./*", "main.py", "cerebrium.toml"]
exclude = [".*"]
shell_commands = []

[cerebrium.hardware]
cpu = 2
memory = 8.0
compute = "AMPERE_A10"
gpu_count = 1

[cerebrium.scaling]
min_replicas = 0
max_replicas = 2
cooldown = 10
